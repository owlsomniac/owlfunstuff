<style>

  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#171a20; --bg2:#111318; --panel:#1f242c; --ink:#e6eaf0; --muted:#8b95a3;
      --line:#333b47; --line-soft:#262c35; --brand:#7aa0cc; --brand-ink:#a9c6ea; --brand-soft:#26323f;
      --btn:#4f74ad; --btn-ink:#ffffff;
      --chip:#232a33; --warn:#e0955a; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);
      --g-body:#212a34; --g-color:#2a281f; --g-pattern:#262331; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.5;
    background:radial-gradient(1100px 520px at 15% -10%,var(--bg2),transparent 60%),var(--bg);min-height:100vh}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
  a{color:var(--brand-ink)}
  h1{font-size:24px;letter-spacing:-.4px;margin:0 0 2px;display:flex;align-items:center;gap:10px}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
  .tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 15px;
    font-size:14px;font-weight:600;cursor:pointer}
  .tab.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin:0 0 16px}
  .card h2{margin:0 0 4px;font-size:16px}
  .card h2 .em{margin-right:6px}
  button{font-family:inherit}
  .btn{border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:10px;padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--brand-ink)}
  .btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
  .btn.gray{border-color:var(--line);background:var(--panel);color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:default}
  select,input[type=text]{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
  label{font-size:12.5px;color:var(--muted);font-weight:600}
  .muted{color:var(--muted)}
  .pill{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;margin:2px 3px 2px 0}
  .swatch{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.25);vertical-align:-2px;margin-right:5px}

  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  th{color:var(--muted);font-weight:700;font-size:12px}
  .scrollx{overflow-x:auto}
  .abil{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .abil .a{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600}
  .abil .a b{color:var(--brand-ink)}
  .genogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .slot{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel)}

  .slot .sel{display:flex;gap:6px}
  .slot .al{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
  .slot .al select{flex:1;min-width:0}
  .mutn{width:46px;padding:5px 4px;text-align:center;flex:0 0 auto}
  .grp-body{background:var(--g-body)} .grp-color{background:var(--g-color)} .grp-pattern{background:var(--g-pattern)}
  .nlist{display:flex;flex-direction:column;gap:8px}
  .retired-box,.sideline-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin:0 0 16px}
  .retired-box>summary,.sideline-box>summary{cursor:pointer;font-weight:700;font-size:15px}
  .retired-box .nrow{opacity:.72} .sideline-box .nrow{opacity:.94}
  .nrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}
  .nrow .grow{flex:1;min-width:0}
  .nrow .nm{font-weight:700}
  .nrow .ab{font-size:12px;color:var(--muted)}
  .prob{display:flex;align-items:center;gap:8px;margin:3px 0}

  .prob .bar>span{display:block;height:100%;background:var(--brand)}

  .prob .nm2{min-width:150px}
  details.gene{border:1px solid var(--line);border-radius:10px;margin:0 0 8px;background:var(--panel)}
  details.gene>summary{cursor:pointer;padding:9px 12px;font-weight:700;font-size:14px;list-style:none}
  details.gene>summary::-webkit-details-marker{display:none}
  details.gene>summary .mode{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:6px}
  details.gene .body{padding:0 12px 10px}
  .note{background:var(--brand-soft);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;margin:0 0 12px}

  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}

  #view-nichelings .rtbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:10px}

  #view-nichelings .rtbl td.nmc{font-weight:700}
  #view-nichelings .rtbl td.num{text-align:right;font-variant-numeric:tabular-nums}
  #view-nichelings .rtbl th.dualh{text-align:center;cursor:default}
  #view-nichelings .rtbl th.dualh .dhname{font-weight:700}
  #view-nichelings .rtbl th.dualh .dsorts{display:flex;gap:3px;justify-content:center;margin-top:2px}

  #view-nichelings .rtbl th.dualh .dsort:hover{background:var(--brand-soft);color:var(--brand-ink)}

  #view-nichelings .rtbl td.gcell .g-homo{color:var(--brand-ink)}

  #view-nichelings .sideadvice .adv-sex{color:var(--muted);font-weight:700}

<script id="qrlib">
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

   One shared module; each tool passes a small adapter. Three channels:

     • Google Drive — auto two-way sync via a hidden appDataFolder file

// 128-bit-ish content fingerprint (cyrb53) so we can tell "changed since last sync".
function cyrb53(str, seed){
  seed=seed||0;

  h2=Math.imul(h2^(h2>>>16),2246822507); h2^=Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,"0")+(h1>>>0).toString(16).padStart(8,"0");

function hashData(data){ return cyrb53(JSON.stringify(data)); }

function envelope(appId, data, now){ return {_sync:1, app:appId, savedAt:now, data:data}; }

   when both sides moved since the last sync it returns "conflict" for the user. */
function decideSync(o){
  const remoteEnv=o.remoteEnv, chan=o.chan||{};
  if(!remoteEnv) return "push";                       // nothing in the cloud yet → seed it
  const firstConnect = !chan.lastRemoteSavedAt;       // never synced this channel before
  if(firstConnect) return o.localEmpty ? "pull" : "conflict";
  const remoteChanged = remoteEnv.savedAt !== chan.lastRemoteSavedAt;
  const localChanged  = o.localHash !== chan.lastHash;
  if(!remoteChanged && !localChanged) return "noop";
  if(localChanged && !remoteChanged) return "push";
  if(remoteChanged && !localChanged) return "pull";

const GH="https://api.github.com";

function gistUpdateReq(token, appId, id, content){
  return {url:GH+"/gists/"+id, method:"PATCH", headers:Object.assign({"Content-Type":"application/json"}, ghHeaders(token)),

function install(adapter){

    if(cfg.drive.fileId) return cfg.drive.fileId;
    const list=await httpJSON(driveListReq(driveTok));
    const id=driveFindId(list, appId); if(id){ cfg.drive.fileId=id; saveCfg(); }
    return cfg.drive.fileId;
  }
  async function driveCall(reqFn){                    // run, refreshing the token once on 401
    try{ return await reqFn(); }
    catch(e){ if(e.status!==401) throw e; await driveToken(cfg.drive.clientId, false); return await reqFn(); }
  }
  async function drivePull(){
    return driveCall(async()=>{
      const id=await driveEnsureId(); if(!id) return null;
      let txt;
      try{ txt=await httpTEXT(driveDownloadReq(driveTok, id)); }
      catch(e){ if(e.status===404){ cfg.drive.fileId=""; saveCfg(); return null; } throw e; }  // file deleted → re-seed
      const env=JSON.parse(txt);
      return validEnv(env,appId)?env:null;
    });
  }
  async function drivePush(content){
    return driveCall(async()=>{
      let id=await driveEnsureId(), meta;
      if(id){
        try{ meta=await httpJSON(driveUpdateReq(driveTok, id, content)); }
        catch(e){ if(e.status!==404) throw e; cfg.drive.fileId=""; id=""; }   // file deleted → recreate
      }
      if(!id) meta=await httpJSON(driveCreateReq(driveTok, appId, content));
      if(meta&&meta.id&&!cfg.drive.fileId){ cfg.drive.fileId=meta.id; saveCfg(); }
      return meta;
    });
  }

  /* ================= shared sync engine ================= */
  const chanOf=name=>cfg[name];
  function pull(name){ return name==="gist"?gistPull():drivePull(); }
  function push(name, content){ return name==="gist"?gistPush(content):drivePush(content); }

  let syncing=false, resyncPending=false;
  async function syncNow(reason){
    const name=cfg.active; if(!name) return;
    if(syncing){ resyncPending=true; return; }     // coalesce overlapping runs; re-run once after
    syncing=true;
    try{
      const chan=chanOf(name);
      status("Syncing…","busy");
      const remoteEnv=await pull(name);
      const data=localData();
      const localHash=hashData(data);
      const action=decideSync({localHash:localHash, localEmpty:isEmpty(data), remoteEnv:remoteEnv, chan:chan});
      if(action==="noop"){ status("Already up to date.","ok"); }
      else if(action==="pull"){ await applyRemote(remoteEnv, name); }
      else if(action==="push"){ await pushLocal(data, localHash, name); }
      else if(action==="conflict"){ conflict(remoteEnv, data, localHash, name); }
    } finally {
      syncing=false;
      if(resyncPending){ resyncPending=false; setTimeout(()=>{ syncNow("resync").catch(()=>{}); }, 0); }
    }
  }
  async function pushLocal(data, localHash, name){
    const env=envelope(appId, data, now());
    const meta=await push(name, JSON.stringify(env));
    const chan=chanOf(name);
    chan.lastHash=localHash; chan.lastRemoteSavedAt=env.savedAt; saveCfg();
    status("Saved to "+chanLabel(name)+".","ok");
    return meta;
  }
  async function applyRemote(env, name){
    if(!validEnv(env,appId)){ status("The cloud copy looks empty or from another tool — nothing loaded.","err"); return; }
    adapter.setData(env.data);
    const chan=chanOf(name);
    chan.lastHash=hashData(env.data); chan.lastRemoteSavedAt=env.savedAt; saveCfg();
    status("Loaded the latest roster from "+chanLabel(name)+".","ok");
  }
  function chanLabel(n){ return n==="gist"?"GitHub":n==="drive"?"Google Drive":"the cloud"; }

  function conflict(remoteEnv, localData, localHash, name){
    const box=el("sk-incoming"); if(!box) return;
    const when=t=>{ try{ return new Date(t).toLocaleString(); }catch(e){ return "unknown time"; } };
    box.innerHTML=`<div class="sk-conflict">
      <b>Both this device and the cloud changed since the last sync.</b>
      <p class="sk-muted" style="margin:6px 0">Cloud copy saved: ${esc(when(remoteEnv.savedAt))}. Pick which to keep — the other is overwritten.</p>
      <div class="sk-row">
        <button class="sk-btn pri" id="sk-cf-remote">Use the cloud copy</button>
        <button class="sk-btn" id="sk-cf-local">Keep this device</button>
        <button class="sk-btn" id="sk-cf-cancel">Cancel</button>
      </div></div>`;
    el("sk-cf-remote").onclick=async()=>{ box.innerHTML=""; try{ await applyRemote(remoteEnv,name); }catch(e){ status("Sync error: "+(e.message||e),"err"); } };
    el("sk-cf-local").onclick=async()=>{ box.innerHTML=""; try{ await pushLocal(localData, localHash, name); }catch(e){ status("Sync error: "+(e.message||e),"err"); } };
    el("sk-cf-cancel").onclick=()=>{ box.innerHTML=""; status("Sync paused — resolve it whenever you like.","muted"); };
    status("Waiting for you to resolve a sync conflict.","err");
  }

  // debounced auto-push after local edits
  let pushTimer=null;
  function notifyChange(){
    if(!cfg.active || !cfg.auto) return;
    clearTimeout(pushTimer);
    pushTimer=setTimeout(()=>{ syncNow("change").catch(e=>status("Sync error: "+(e.message||e),"err")); }, 2500);
  }

  /* ================= TRANSFER LINK / QR ================= */
  async function linkMake(){
    setBusy("sk-link-make",true);
    try{
      const code=await encodeLink(envelope(appId, localData(), now()));
      const url=(typeof location!=="undefined"?(location.origin+location.pathname):"")+"#s="+code;
      const out=el("sk-link-out"); out.style.display="block"; out.value=url;
      const copy=el("sk-link-copy"); copy.style.display="inline-block";
      copy.onclick=()=>{ out.select(); try{ navigator.clipboard.writeText(url); status("Link copied.","ok"); }catch(e){ document.execCommand&&document.execCommand("copy"); } };
      renderQR(el("sk-qr"), url);
      status("Transfer link ready — open or scan it on your other device.","ok");
    }catch(e){ status("Couldn't build a link: "+(e.message||e),"err"); }
    finally{ setBusy("sk-link-make",false); }
  }
  function renderQR(box, text){
    if(!box) return;
    if(typeof qrcode==="undefined"){ box.innerHTML=`<p class="sk-muted">(QR unavailable — use the link text.)</p>`; return; }
    try{ const qr=qrcode(0,"L"); qr.addData(text); qr.make();
      box.innerHTML=`<img alt="Transfer QR code" src="${qr.createDataURL(4,2)}">`; }
    catch(e){ box.innerHTML=`<p class="sk-muted">Roster is too big for a QR code — use the link or code text instead (a QR only holds so much).</p>`; }
  }
  async function linkLoad(){
    const raw=(el("sk-link-in").value||"").trim(); if(!raw){ status("Paste a link or code first.","err"); return; }
    try{
      const env=await decodeLink(raw);
      if(!validEnv(env,appId)){ status("That code isn't a "+appId+" roster.","err"); return; }
      pendingImport=env; showIncoming();
    }catch(e){ status("Couldn't read that link/code — it may be incomplete.","err"); }
  }
  function showIncoming(){
    const box=el("sk-incoming"); if(!box||!pendingImport) return;
    // Import data comes from an untrusted #s= link; never interpolate adapter output raw.
    const n0=adapter.count?adapter.count(pendingImport.data):null;
    const n=(typeof n0==="number"&&isFinite(n0))?n0:null;
    const when=(()=>{ try{ return new Date(pendingImport.savedAt).toLocaleString(); }catch(e){ return ""; } })();
    box.innerHTML=`<div class="sk-alert">
      <b>Incoming roster</b>${n!=null?` — ${n} entr${n===1?"y":"ies"}`:""}${when?` (saved ${esc(when)})`:""}.
      <p class="sk-muted" style="margin:6px 0">Loading it will replace what's on this device.</p>
      <div class="sk-row">
        <button class="sk-btn pri" id="sk-imp-yes">Replace my roster</button>
        <button class="sk-btn" id="sk-imp-no">Cancel</button>
      </div></div>`;
    el("sk-imp-yes").onclick=()=>{ adapter.setData(pendingImport.data); pendingImport=null; box.innerHTML=""; clearHash(); status("Roster loaded from the transfer link.","ok"); };
    el("sk-imp-no").onclick=()=>{ pendingImport=null; box.innerHTML=""; clearHash(); status("Import cancelled.","muted"); };
  }
  function clearHash(){ try{ if(location.hash.indexOf("#s=")===0) history.replaceState(null,"",location.pathname+location.search); }catch(e){} }

  /* ---- small DOM helpers ---- */
  function setBusy(id,on){ const b=el(id); if(b){ b.disabled=on; } }

  /* ================= INIT ================= */
  render();
  // Incoming transfer link in the URL?
  try{
    if(typeof location!=="undefined" && location.hash.indexOf("#s=")===0){
      decodeLink(location.hash).then(env=>{ if(validEnv(env,appId)){ pendingImport=env; if(adapter.reveal) adapter.reveal(); showIncoming(); } }).catch(()=>{});
    }
  }catch(e){}
  // Auto pull on open for the active channel.
  if(cfg.active && cfg.auto){ syncNow("open").catch(e=>status("Sync error: "+(e.message||e),"err")); }

  const api={notifyChange, syncNow, render, adapter, get cfg(){ return cfg; }};
  try{ (typeof window!=="undefined"?window:globalThis).SYNCKIT_API=api; }catch(e){}
  return api;
}

const SYNCKIT={install, pure:PURE};
try{ (typeof window!=="undefined"?window:globalThis).SYNCKIT=SYNCKIT; }catch(e){}
if(typeof module!=="undefined" && module.exports) module.exports=SYNCKIT;
})();
</script>
<script>
"use strict";
/* =========================================================================
   Niche: Breed & Evolve — Genetics Advisor
   Single-file, no dependencies. Gene data from the Niche Wiki B&E gene page.
   ========================================================================= */

/* ---- ability list (the only stats B&E genes grant) ---- */
const ABILITIES = ["Perception","Strength","Collecting","Fishing","Swimming","Cold Resistance","Heat Resistance","Poison Resistance"];
const AB_SHORT = {"Perception":"Per","Strength":"Str","Collecting":"Col","Fishing":"Fish","Swimming":"Swim",
  "Cold Resistance":"Cold","Heat Resistance":"Heat","Poison Resistance":"Poison"};

/* ---- colour shades + hex (for incomplete-dominance blend swatches) ---- */
const SHADE_HEX = {White:"#f0ebe0",Beige:"#d9c6a2","Moss Brown":"#8c8759",Yellow:"#e6c34d",Orange:"#d8813a",
  Red:"#b23b2e","Chestnut Brown":"#9c5b33",Brown:"#7a4a2b","Dark Brown":"#4f3320",Black:"#2b2622"};
const FUR_SHADES  = ["White","Beige","Moss Brown","Yellow","Orange","Chestnut Brown","Brown","Dark Brown","Black"];
const PAT_SHADES  = ["White","Beige","Moss Brown","Yellow","Orange","Red","Chestnut Brown","Brown","Dark Brown","Black"];
const HORN_SHADES = ["White","Beige","Red","Brown","Black"];
const EYECOL_HEX = {"Black Eyes":"#26221f","Brown Eyes":"#6b4a2b","Yellow Eyes":"#e6c34d","Green Eyes":"#4c8a3a",
  "Blue Eyes":"#3a6ea5","Leaf Green Eyes":"#5aa03a","Light Green Eyes":"#8fc46a","Teal Eyes":"#2f9c93",
  "Light Blue Eyes":"#86c1e0","Violet Eyes":"#8a5bd0","Orange Eyes":"#e07f2f","Pink Eyes":"#e58fb0","Red Eyes":"#c23b2e"};

/* Effect helper: build an allele {k,name,eff,cat}. eff maps ability->value. */
function A(name, eff, cat){ return {k:name, name, eff:eff||{}, cat:cat||"Basic"}; }
/* Colour alleles (no stats) from a shade list. */
function shadeAlleles(list){ return list.map(s=>({k:s, name:s, eff:{}, cat:"Basic", shade:s})); }

/* ---- the 18 gene categories, alleles listed MOST-DOMINANT first (for linear) ---- */
const GENES = [
  // ----- body / ability genes (linear complete dominance) -----
  {key:"ears", label:"Ears", mode:"linear", group:"body", alleles:[
    A("Medium Ears",{Perception:1}), A("Big Ears",{"Heat Resistance":2},"Hot"), A("Fluffy Ears",{"Cold Resistance":1},"Cold"),
    A("Round Ears",{Perception:1},"Cold"), A("Rabbit Ears",{Perception:3},"Grass"), A("Floppy Ears",{Perception:2},"Cold"),
    A("Pointy Ears",{Perception:2},"Grass") ]},
  {key:"horns", label:"Horns", mode:"linear", group:"body", alleles:[
    A("No Horns",{}), A("Goat Horns",{Strength:1}), A("Ram Horns",{Strength:2},"Hot"),
    A("Savanna Horns",{"Heat Resistance":1},"Hot"), A("Antlers",{"Cold Resistance":1},"Cold") ]},
  {key:"eyes", label:"Eyes", mode:"linear", group:"body", alleles:[
    A("Eyes",{Perception:2}), A("Shortsighted Eyes",{Perception:1}), A("Blind Eyes",{}) ]},
  {key:"head", label:"Head / Snout", mode:"linear", group:"body", alleles:[
    A("Derp Snout",{Perception:1}), A("Short Snout",{Perception:2}), A("Big Nose",{Perception:3},"Grass"),
    A("Cracker Jaw",{Collecting:2},"Hot"), A("Poison Fangs",{"Poison Resistance":2},"Poison"), A("Boar Tusks",{Strength:1},"Grass"),
    A("Platypus Beak",{Fishing:1},"Water"), A("Sabertooth Fangs",{Strength:2},"Cold"), A("Sticky Tongue",{Collecting:2},"Hot"),
    A("Purr Snout",{Perception:2},"Grass"), A("Digging Trunk",{Collecting:2},"Hot"), A("Bird Beak",{Collecting:2},"Grass") ]},
  {key:"body", label:"Body", mode:"linear", group:"body", alleles:[
    A("Medium Body",{Strength:1}), A("Spiky Body",{Strength:2},"Hot") ]},
  {key:"paws", label:"Paws / Hands", mode:"linear", group:"body", alleles:[
    A("Nimble Fingers",{Collecting:2}), A("Claw",{Strength:1},"Grass"), A("Digging Paw",{Collecting:3},"Grass"),
    A("Strong Paw",{Strength:1},"Cold"), A("Hoof",{Strength:2},"Grass"), A("Deformed Paw",{Collecting:1}),
    A("Fluffy Paw",{"Cold Resistance":1},"Cold"), A("Carnivore Claw",{Fishing:2},"Hot") ]},
  {key:"hindlegs", label:"Hind Legs", mode:"linear", group:"body", alleles:[
    A("Hind Legs",{Strength:1}), A("Carnivore Hind Legs",{Fishing:2},"Grass") ]},
  {key:"tail", label:"Tail", mode:"linear", group:"body", alleles:[
    A("Medium Tail",{"Cold Resistance":1}), A("No Tail",{}), A("Swimming Tail",{Swimming:1},"Water"),
    A("Fishing Tail",{Fishing:2},"Grass"), A("Warm Tail",{"Cold Resistance":2},"Cold"), A("Long Tail",{Collecting:1},"Grass"),
    A("Stinky Tail",{"Poison Resistance":1},"Poison"), A("Scorpion Tail",{"Heat Resistance":1},"Hot"), A("Hammer Tail",{Strength:2},"Cold") ]},
  // ----- colours (incomplete dominance — both alleles blend) -----
  {key:"furcolor", label:"Fur Color", mode:"incomplete", group:"color", alleles:shadeAlleles(FUR_SHADES)},
  {key:"manecolor", label:"Mane Color", mode:"incomplete", group:"color", alleles:shadeAlleles(FUR_SHADES)},
  {key:"horncolor", label:"Horn Color", mode:"incomplete", group:"color", alleles:shadeAlleles(HORN_SHADES)},
  // ----- eye colour is LINEAR in B&E (not a blend) -----
  {key:"eyecolor", label:"Eye Color", mode:"linear", group:"color", alleles:[
    A("Black Eyes"), A("Brown Eyes"), A("Yellow Eyes",{},"Grass"), A("Green Eyes",{},"Grass"), A("Blue Eyes",{},"Cold"),
    A("Leaf Green Eyes",{},"Grass"), A("Light Green Eyes",{},"Grass"), A("Teal Eyes",{},"Cold"), A("Light Blue Eyes",{},"Cold"),
    A("Violet Eyes",{},"Cold"), A("Orange Eyes",{},"Hot"), A("Pink Eyes",{},"Hot"), A("Red Eyes",{},"Hot") ]},
  // ----- pattern & mane shape (linear) -----
  {key:"manetype", label:"Mane Type", mode:"linear", group:"pattern", alleles:[
    A("Straight Mane"), A("Shaggy Mane",{},"Grass"), A("Curly Mane",{"Cold Resistance":1},"Cold") ]},
  {key:"patterntype", label:"Pattern Type", mode:"linear", group:"pattern", alleles:[
    A("No Pattern"), A("Spots"), A("Wavy Stripes",{},"Cold"), A("Dots",{},"Grass"), A("Blotches",{},"Grass"),
    A("Jagged Stripes",{},"Hot"), A("Marbled Stripes",{},"Cold"), A("Leopard Spots",{},"Hot") ]},
  {key:"patternsize", label:"Pattern Size", mode:"linear", group:"pattern", alleles:[
    A("Medium Pattern"), A("Small Pattern"), A("Large Pattern"), A("Very Small Pattern"), A("Very Big Pattern") ]},
  {key:"patterndensity", label:"Pattern Density", mode:"linear", group:"pattern", alleles:[
    A("Medium Density Pattern"), A("Sparse Pattern"), A("Dense Pattern"), A("Very Sparse Pattern"), A("Very Dense Pattern") ]},
  // pattern colour sits with the pattern genes in the genome (right before Mask) and still blends
  {key:"patterncolor", label:"Pattern Color", mode:"incomplete", group:"pattern", alleles:shadeAlleles(PAT_SHADES)},
  {key:"masksize", label:"Mask Size", mode:"linear", group:"pattern", alleles:[
    A("No Mask"), A("Medium Mask"), A("Small Mask"), A("Large Mask"), A("Very Small Mask"), A("Very Large Mask") ]}
];
const GENE_BY_KEY = {}; GENES.forEach(g=>{ GENE_BY_KEY[g.key]=g; g.domRank={}; g.alleles.forEach((a,i)=>g.domRank[a.k]=i); });
const PATTERN_SUBGENES = ["patternsize","patterndensity","patterncolor"];  // hidden when "No Pattern" is expressed
/* Fixed gene order for the compact gene code — kept stable so reordering the DISPLAY never changes
   what an existing code means. Do not reorder/remove keys; only append new genes at the end. */
const CODE_ORDER = ["ears","horns","eyes","head","body","paws","hindlegs","tail","furcolor","manecolor",
  "horncolor","patterncolor","eyecolor","manetype","patterntype","patternsize","patterndensity","masksize"];

/* =========================================================================
   ENGINE
   ========================================================================= */
/* A genotype = { geneKey: [alleleKeyA, alleleKeyB] }. Order within a slot is not meaningful. */

/* ---- mutation ----
   A mutated allele is stored as its key with a trailing "*", e.g. "Nimble Fingers*". It grants a
   stronger bonus (MUT_BONUS added to each ability it already gives) and is inherited like any allele.
   baseK strips the mark for dominance/effect lookups; isMut tests it. */
const MUT="*";   // a mutated allele is stored as "Key*N", N = mutation level (stackable, adds +N to its bonus)
const baseK=a=>{ const s=String(a==null?"":a), i=s.indexOf(MUT); return i<0?s:s.slice(0,i); };
const mutLevel=a=>{ const s=String(a==null?"":a), i=s.indexOf(MUT); if(i<0) return 0; const n=parseInt(s.slice(i+1),10); return isNaN(n)?1:Math.max(0,n); };  // "*" with no number = legacy level 1
const isMut=a=>mutLevel(a)>0;
const withMut=(k,n)=>{ n=Math.max(0,Math.floor(+n||0)); return n>0 ? baseK(k)+MUT+n : baseK(k); };

function defaultGenotype(){ const g={}; GENES.forEach(x=>{ const a=x.alleles[0].k; g[x.key]=[a,a]; }); return g; }

/* Compact shareable gene code: "NB1-" + two base36 allele-indices per gene, in GENE order.
   36 chars total (max 13 alleles → one base36 digit each). Tolerant on decode. */
function genoToCode(geno){
  let s="", mut="", any=false;
  CODE_ORDER.forEach(key=>{ const g=GENE_BY_KEY[key], p=geno[key]||[g.alleles[0].k,g.alleles[0].k];
    s += (g.domRank[baseK(p[0])]||0).toString(36) + (g.domRank[baseK(p[1])]||0).toString(36);
    const l0=Math.min(35,mutLevel(p[0])), l1=Math.min(35,mutLevel(p[1])); if(l0||l1) any=true;
    mut += l0.toString(36) + l1.toString(36); });   // per-allele mutation level, base36
  return "NB1-"+s+(any?"!"+mut:"");                  // "!" section only when something is mutated
}
function codeToGeno(code){
  const m=String(code||"").trim().match(/^NB1-([0-9a-z]+)(?:!([0-9a-z]+))?$/i); if(!m) return null;
  const s=m[1].toLowerCase(), mut=(m[2]||"").toLowerCase(), geno=defaultGenotype();
  CODE_ORDER.forEach((key,i)=>{ const g=GENE_BY_KEY[key];
    [0,1].forEach(j=>{ let al=geno[key][j]; const ch=s[2*i+j];
      if(ch!=null){ const idx=parseInt(ch,36); if(idx>=0&&idx<g.alleles.length) al=g.alleles[idx].k; }
      geno[key][j]=withMut(al, parseInt(mut[2*i+j]||"0",36)||0); });
  });
  return geno;
}
/* Sample ONE possible offspring genotype (one random allele from each parent per gene). */
function sampleOffspring(mom, dad){
  const g={}; GENES.forEach(x=>{ const mp=mom[x.key]||[x.alleles[0].k,x.alleles[0].k], dp=dad[x.key]||[x.alleles[0].k,x.alleles[0].k];
    g[x.key]=[ mp[Math.random()<0.5?0:1], dp[Math.random()<0.5?0:1] ]; });
  return g;
}

/* The expressed phenotype for one gene slot, given its two allele keys.
   Returns {kind, ...}: linear -> {kind:"single", allele}; paws -> {kind:"pair", alleles:[a,b]};
   incomplete -> {kind:"blend", alleles:[a,b]}. */
function expressGene(gene, pair){
  const [x,y] = pair;
  if(gene.mode==="incomplete"){ return {kind:"blend", alleles:[x,y].slice().sort()}; }  // colours blend
  const rx=gene.domRank[baseK(x)]||0, ry=gene.domRank[baseK(y)]||0;   // linear: more dominant (lower rank) shows (unknown base → 0, as in genoToCode)
  if(rx!==ry) return {kind:"single", allele:(rx<ry?x:y)};       // winner keeps its mutation level
  return {kind:"single", allele:(mutLevel(x)>=mutLevel(y)?x:y)}; // same allele twice → the more-mutated copy shows
}

/* Full expressed phenotype for a genotype, plus which slots are inactivated by epistasis. */
function phenotype(geno){
  const out={};
  GENES.forEach(g=>{ out[g.key]=expressGene(g, geno[g.key]||[g.alleles[0].k,g.alleles[0].k]); });
  const noPattern = out.patterntype && out.patterntype.allele==="No Pattern";
  out._inactive = {};
  if(noPattern) PATTERN_SUBGENES.forEach(k=>out._inactive[k]=true);
  return out;
}

/* Ability totals from the EXPRESSED (dominant) allele of each gene. Colours have no stats. */
function abilityTotals(geno){
  const t={}; ABILITIES.forEach(a=>t[a]=0);
  GENES.forEach(g=>{
    const pair=geno[g.key]||[]; if(!pair.length || g.mode==="incomplete") return;
    const ex=expressGene(g,pair).allele, al=g.alleles.find(a=>a.k===baseK(ex)), boost=mutLevel(ex);
    if(al) for(const k in al.eff) t[k]+=al.eff[k]+boost;   // mutation level adds +N to the allele's bonus
  });
  return t;
}

/* Inheritance: each parent passes one of its two alleles at 50%.
   Returns a map "sortedPairKey" -> probability for the offspring's genotype at one slot. */
function offspringGenotypeDist(momPair, dadPair){
  const dist={};
  [momPair[0],momPair[1]].forEach(m=>{
    [dadPair[0],dadPair[1]].forEach(d=>{
      const key=[m,d].slice().sort().join("|");
      dist[key]=(dist[key]||0)+0.25;
    });
  });
  return dist;   // keys are "a|b"
}

/* Distribution over EXPRESSED phenotypes for one gene, from two parents. Returns
   [{label, prob, detail}] sorted desc, plus the raw genotype dist. */
function offspringPhenotypeDist(gene, momPair, dadPair){
  const gd=offspringGenotypeDist(momPair, dadPair);
  const pheno={};
  for(const key in gd){
    const pair=key.split("|");
    const ex=expressGene(gene, pair);
    let label;
    if(ex.kind==="single") label=ex.allele;
    else label=ex.alleles.join(" + ");
    pheno[label]=(pheno[label]||0)+gd[key];
  }
  const arr=Object.keys(pheno).map(l=>({label:l, prob:pheno[l]})).sort((a,b)=>b.prob-a.prob);
  return {pheno:arr, geno:gd};
}

/* Expected ability totals for offspring of two parents (P(expressed dominant allele)·eff per gene),
   with per-ability min/max across the possible offspring. Colours carry no stats. */
function offspringAbilityOutlook(mom, dad){
  const exp={}, lo={}, hi={}; ABILITIES.forEach(a=>{exp[a]=0;lo[a]=0;hi[a]=0;});
  GENES.forEach(g=>{
    if(g.mode==="incomplete") return;
    const mp=mom[g.key]||[], dp=dad[g.key]||[];
    const {pheno}=offspringPhenotypeDist(g, mp.length?mp:[g.alleles[0].k,g.alleles[0].k], dp.length?dp:[g.alleles[0].k,g.alleles[0].k]);
    ABILITIES.forEach(a=>{
      let e=0, mn=Infinity, mx=-Infinity;
      pheno.forEach(p=>{ const al=g.alleles.find(x=>x.k===baseK(p.label)); const bv=al&&al.eff[a]?al.eff[a]:0;
        const v=bv+(bv?mutLevel(p.label):0); e+=p.prob*v; mn=Math.min(mn,v); mx=Math.max(mx,v); });
      exp[a]+=e; lo[a]+=(mn===Infinity?0:mn); hi[a]+=(mx===-Infinity?0:mx);
    });
  });
  return {exp, lo, hi};
}

/* =========================================================================
   ROSTER ANALYSIS — retirement candidates
   A nicheling is "redundant" when another nicheling OF THE SAME SEX carries every
   allele it does, at an equal-or-higher mutation level: that other one can pass on
   everything this one could, so retiring it costs no breeding option. Compared per
   sex (a ♀ can only be replaced by a ♀; unsexed nichelings are skipped). "Ability"
   mode compares only genes that grant an ability/resistance, ignoring purely cosmetic
   genes (colours, eye colour, pattern shape/size/colour, mask, mane shape w/o effect).
   ========================================================================= */
const ABILITY_GENE_KEYS = GENES.filter(g=>g.alleles.some(a=>Object.keys(a.eff).length)).map(g=>g.key);

/* base allele -> highest mutation level this genotype carries, per gene */
function carryMap(geno){
  const m={};
  GENES.forEach(g=>{ const pair=geno[g.key]||[], mm={};
    pair.forEach(a=>{ const b=baseK(a), l=mutLevel(a); if(!(b in mm)||l>mm[b]) mm[b]=l; });
    m[g.key]=mm; });
  return m;
}
/* does carry B cover carry A over `keys`? (B holds every allele A holds, at >= level) */
function carryDominates(cb, ca, keys){
  return keys.every(k=>{ const A=ca[k]||{}, B=cb[k]||{};
    return Object.keys(A).every(b=> (b in B) && B[b]>=A[b]); });
}
/* Which nichelings can be retired without losing a breeding option? Returns
   [{id,name,sex,keepId,keepName}] — keep* is a nicheling that carries everything
   the retiree does. opts.abilityOnly (default false) restricts to ability genes. */
function findRetirements(cats, opts){
  opts=opts||{}; const keys = opts.abilityOnly ? ABILITY_GENE_KEYS : GENES.map(g=>g.key);
  const res=[];
  ["F","M"].forEach(sex=>{
    const grp=cats.filter(c=>c.sex===sex).map(c=>({c, carry:carryMap(c.geno)}));
    const retired=new Set();
    for(let i=0;i<grp.length;i++){ const A=grp[i];
      for(let j=0;j<grp.length;j++){ if(i===j) continue; const B=grp[j];
        if(carryDominates(B.carry,A.carry,keys)){
          const strict=!carryDominates(A.carry,B.carry,keys);
          if(strict || j<i){ retired.add(A.c.id); break; }   // strictly better, or an earlier identical copy
        }
      }
    }
    grp.forEach(A=>{ if(!retired.has(A.c.id)) return;
      const keeper = grp.find(B=>B.c.id!==A.c.id && !retired.has(B.c.id) && carryDominates(B.carry,A.carry,keys))
                  || grp.find(B=>B.c.id!==A.c.id && carryDominates(B.carry,A.carry,keys));
      res.push({id:A.c.id, name:A.c.name, sex, keepId:keeper?keeper.c.id:null, keepName:keeper?keeper.c.name:null});
    });
  });
  return res;
}

/* ---- value model for culling ----
   Each allele contributes, for its ability, a point (base, total) = (bonus, bonus+mutation). A trait is
   only "covered" when another nicheling provides a point that beats it on BOTH — so a mutation on a
   weaker allele can NOT cover a stronger-base allele (Nimble base 2 ✦+3 = total 5 does NOT cover Digging
   base 3 ✦+1 = total 4: it wins on total but loses on base — different traits, keep both). Zero-bonus
   alleles (No Horns, Blind Eyes, No Tail) make no point (worth nothing). A plain lower-bonus allele IS
   covered by a higher-bonus one for the same ability (Deformed base 1 < Nimble base 2, and ≤ on total).
   Cosmetic genes (colours/patterns/eye/mask/plain mane) use an identity point per allele so a unique
   colour still counts in "all genes" mode. `catContribs` → { "gene|ability" | "gene|allele" : [pts] }. */
const isAbilityGene = g => g.alleles.some(al=>Object.keys(al.eff).length);
const NULL_ALLELES = {"No Horns":1, "Blind Eyes":1, "No Tail":1};   // "absence" alleles — never worth keeping, even in all-genes mode
function catContribs(geno, keys, all){   // `all` = all-genes mode (cosmetics count)
  const m={};
  keys.forEach(k=>{ const g=GENE_BY_KEY[k]; if(!g) return; const pair=geno[k]||[];
    if(isAbilityGene(g)){
      pair.forEach(x=>{ const b=baseK(x), al=g.alleles.find(z=>z.k===b); if(!al) return; const lv=mutLevel(x);
        const abils=Object.keys(al.eff);
        if(abils.length){ for(const ab of abils){ const base=al.eff[ab]; if(base>0){ const key=k+"|"+ab; (m[key]||(m[key]=[])).push({base, total:base+lv, allele:b}); } } }
        else if(all && !NULL_ALLELES[b]){ const key=k+"|"+b; (m[key]||(m[key]=[])).push({base:1, total:1+lv, allele:b}); }   // cosmetic variant of a mixed gene (e.g. Straight/Shaggy Mane)
      });
    } else {
      pair.forEach(x=>{ const key=k+"|"+baseK(x); (m[key]||(m[key]=[])).push({base:1, total:1+mutLevel(x), allele:baseK(x)}); });
    }
  });
  // reduce each gene|ability to its Pareto frontier (drop a cat's own points dominated by another of its own)
  for(const key in m){ const pts=m[key];
    m[key]=pts.filter((p,i)=>!pts.some((q,j)=>j!==i && q.base>=p.base && q.total>=p.total && (q.base>p.base||q.total>p.total||j<i)));
  }
  return m;
}
const domPt=(p,B)=>B.some(q=>q.base>=p.base && q.total>=p.total);          // some point of B beats p on BOTH axes
const coveredBy=(A,B)=>Object.keys(A).every(k=>A[k].every(p=>domPt(p,B[k]||[])));   // B covers every point of A
function uniquePoints(A,others){ const out=[];                            // A's points no other cat dominates
  for(const k in A) A[k].forEach(p=>{ if(!others.some(o=>domPt(p,o[k]||[]))) out.push({key:k, ...p}); }); return out; }
function pointLabel(key, p){ const i=key.indexOf("|"), gk=key.slice(0,i), rest=key.slice(i+1), g=GENE_BY_KEY[gk];
  if(g && isAbilityGene(g)) return `${p.allele} (${AB_SHORT[rest]||rest} +${p.total})`;   // rest = ability
  return `${p.allele}${p.total>1?` ✦+${p.total-1}`:""}${g?` (${g.label})`:""}`; }          // rest = colour/allele
/* the set of cats (from `others`, tried in the given order → pass them best-first) whose points TOGETHER
   dominate every point of A. Greedy set-cover; returns the chosen entries, or null if they can't fully
   cover A. `others` = [{c, contribs}]. Empty A → [] (nothing to cover). */
function coveringSet(Acontribs, others){
  const pts=[]; for(const k in Acontribs) Acontribs[k].forEach(p=>pts.push({key:k, p}));
  if(!pts.length) return [];
  let remaining=pts.slice(); const chosen=[];
  while(remaining.length){
    let bestO=null, bestCov=null;
    for(const o of others){ if(chosen.indexOf(o)>=0) continue;
      const cov=remaining.filter(rp=>domPt(rp.p, o.contribs[rp.key]||[]));
      if(!bestCov || cov.length>bestCov.length){ bestO=o; bestCov=cov; }
    }
    if(!bestO || !bestCov.length) return null;                     // some point nobody covers
    chosen.push(bestO); remaining=remaining.filter(rp=>bestCov.indexOf(rp)<0);
  }
  return chosen;
}

/* ---- allele-IDENTITY value model for retire/release (replaces fungible-ability/collective coverage) ----
   A nicheling is only "safe to remove" when a SINGLE other same-sex nicheling already carries every one of
   its (non-undesirable) alleles at an equal-or-higher MUTATION LEVEL and COPY COUNT — i.e. a genuine
   duplicate. Coverage is by ALLELE, not by ability: a rare allele (e.g. Bird Beak) is NOT "covered" just
   because some other nicheling has the same ability from a different allele, and a nicheling that
   CONCENTRATES many good/mutated alleles in one body (several homozygous ✦ alleles, a maxed line) stays
   valuable even when each allele also exists spread across the roster — re-combining them into one body is
   the whole breeding project. Undesirable "absence" alleles (No Horns, Blind Eyes, No Tail, Deformed Paw)
   are worth nothing: they never count as value and never need covering. */
const UNDESIRABLE = {"No Horns":1,"Blind Eyes":1,"No Tail":1,"Deformed Paw":1};
/* holdings(geno) -> { "geneKey|baseAllele": [levels, desc — one entry per copy] }, dropping undesirable
   alleles. Ability-only mode keeps only alleles that grant an ability; all-genes mode also keeps every
   cosmetic allele by identity (so a unique colour still counts). */
function holdings(geno, keys, all){
  const h={};
  keys.forEach(k=>{ const g=GENE_BY_KEY[k]; if(!g) return; const isAbil=isAbilityGene(g);
    (geno[k]||[]).forEach(x=>{ const b=baseK(x); if(UNDESIRABLE[b]) return;
      if(isAbil){ const al=g.alleles.find(z=>z.k===b), hasEff=al&&Object.keys(al.eff).length;
        if(!hasEff && !all) return; }                 // a no-bonus allele of an ability gene counts only in all-genes mode
      (h[k+"|"+b]||(h[k+"|"+b]=[])).push(mutLevel(x));
    });
  });
  for(const key in h) h[key].sort((a,b)=>b-a);
  return h;
}
/* does a held level-list cover a required one? (≥ copies, and each copy ≥ the matching required level) */
function holdKeyCovers(have, need){ if(!have || have.length<need.length) return false;
  for(let i=0;i<need.length;i++){ if(have[i]<need[i]) return false; } return true; }
/* does B's whole holdings cover A's? (a single nicheling carrying everything A does, ≥ level & copies) */
function holdCovers(B, A){ return Object.keys(A).every(k=>holdKeyCovers(B[k], A[k])); }
/* intrinsic worth = Σ (1+level) over every non-undesirable allele copy — rewards concentration + mutation */
function holdValue(A){ let v=0; for(const k in A) A[k].forEach(l=>v+=1+l); return v; }
function holdLabel(key, levels){ const i=key.indexOf("|"), gk=key.slice(0,i), b=key.slice(i+1), g=GENE_BY_KEY[gk];
  const lv=levels[0]||0, cnt=levels.length, al=g&&g.alleles.find(z=>z.k===b), ab=al&&Object.keys(al.eff)[0];
  return `${b}${lv?` ✦+${lv}`:""}${cnt>1?` ×${cnt}`:""}${ab?` (${AB_SHORT[ab]||ab})`:""}`; }

/* Ranked retirement/release suggestions (never a flat "nothing to retire").
   "Safe — loses nothing" = a single same-sex nicheling is a true DUPLICATE (covers every allele at ≥ level
   & copies), OR the nicheling carries nothing of value (only undesirable/absence alleles). Everyone else is
   ranked LEAST-VALUABLE first by concentration value, with sole-copy alleles (★) weighted to the bottom so a
   unique rare allele or a maxed line is never treated as disposable. */
function retirementRanking(cats, opts){
  opts=opts||{}; const keys = opts.abilityOnly ? ABILITY_GENE_KEYS : GENES.map(g=>g.key);
  const res=[];
  ["F","M"].forEach(sex=>{
    const group = cats.filter(c=>c.sex===sex).map(c=>({c, h:holdings(c.geno,keys,!opts.abilityOnly)}));
    group.forEach((A,i)=>{
      const others=group.filter(x=>x!==A);
      const keepers=others.filter(B=>holdCovers(B.h, A.h));           // single nichelings that fully cover A
      let redundant=false, keepNames=[];
      if(keepers.length){
        if(keepers.some(B=>!holdCovers(A.h, B.h))) redundant=true;    // a strictly-better duplicate exists
        else if(keepers.some(B=>group.indexOf(B)<i)) redundant=true;  // all mutual duplicates → keep the earliest copy
        if(redundant) keepNames=keepers.map(k=>k.c.name);
      }
      const val=holdValue(A.h);
      let uniqueCount=0;
      const loses=Object.keys(A.h).map(k=>{ const lvls=A.h[k];
          const uniq=!others.some(o=>holdKeyCovers(o.h[k], lvls)); if(uniq) uniqueCount++;
          return {key:k, lvls, uniq}; })
        .sort((a,b)=> (b.uniq-a.uniq) || (b.lvls[0]-a.lvls[0]))
        .map(x=>holdLabel(x.key,x.lvls)+(x.uniq?" ★":""));
      const safe = redundant || val===0;
      res.push({ id:A.c.id, name:A.c.name, sex, status:A.c.status,
                 lossValue: safe ? 0 : (val + 1000*uniqueCount),   // sole-copy holders sort to the bottom (most valuable)
                 kept: group.length-1, keepNames, keepName:keepNames[0]||null, loses, uniqueCount });
    });
  });
  return res;
}

/* =========================================================================
   MAX-MUTATIONS PLAN — gather the best mutated alleles into one line
   Model: pass-through inheritance (a pup can inherit either parent's allele AT ITS LEVEL), so a cross
   of the current line with a partner can, with luck, yield a pup carrying the per-gene MAX of both.
   The plan is a greedy order of crosses, biggest mutation gain first, that consolidates the highest
   mutated alleles you own into a single nicheling. It does NOT raise a level beyond what you have.
   ========================================================================= */
const geneMaxLevels=geno=>{ const m={}; GENES.forEach(g=>{ const p=geno[g.key]||[]; m[g.key]=p.length?Math.max(...p.map(mutLevel)):0; }); return m; };
const mutationScore=geno=>GENES.reduce((s,g)=>{ const p=geno[g.key]||[]; return s+(p.length?Math.max(...p.map(mutLevel)):0); },0);
/* total stat points a genotype gains from ✦ mutations on its EXPRESSED ability alleles (matches abilityTotals:
   a mutation adds +level to each ability the shown allele grants). Cosmetic ✦ contribute no stat bonus. */
function mutBonus(geno){ let s=0;
  GENES.forEach(g=>{ if(g.mode==="incomplete") return; const pair=geno[g.key]||[]; if(!pair.length) return;
    const ex=expressGene(g,pair).allele, al=g.alleles.find(a=>a.k===baseK(ex));
    if(al){ const n=Object.keys(al.eff).length; if(n) s+=mutLevel(ex)*n; } });
  return s; }
/* sum of expressed ability bonuses (base + mutation) across all eight abilities */
const statTotal=geno=>{ const t=abilityTotals(geno); return ABILITIES.reduce((s,a)=>s+t[a],0); };
/* Recommendation for a SIDELINE nicheling: Add to tribe (brings alleles the tribe lacks) vs Release
   (a same-sex tribe member already carries everything it has). Same allele-identity coverage as retire/release. */
function sidelineAdvice(cat, activeCats){
  if(cat.sex!=="F" && cat.sex!=="M") return {action:"setsex", reason:"Set its sex (♀/♂) to compare it against your tribe."};
  const keys=GENES.map(g=>g.key), mine=holdings(cat.geno,keys,true), sx=cat.sex==="F"?"♀":"♂";
  if(!holdValue(mine)) return {action:"release", reason:"Carries no valuable alleles (only absence/undesirable) — safe to release."};
  const peers=(activeCats||[]).filter(c=>c.status==="active" && c.sex===cat.sex);
  if(!peers.length) return {action:"add", reason:`No ${sx} in your tribe yet — add it to start that line.`};
  const peerHold=peers.map(p=>({p, h:holdings(p.geno,keys,true)}));
  const coverer=peerHold.find(x=>holdCovers(x.h, mine));
  if(coverer) return {action:"release", reason:`${coverer.p.name} already carries everything it has (≥ ✦ level & copies) — brings nothing new. Safe to release.`};
  const brings=[]; for(const k in mine){ const need=mine[k]; if(!peerHold.some(x=>holdKeyCovers(x.h[k], need))) brings.push(holdLabel(k, need)); }
  const reason = brings.length ? `Brings ${brings.slice(0,4).join(", ")}${brings.length>4?", …":""} no ${sx} in your tribe has — worth adding.`
                               : `Combines alleles now spread across your tribe into one ${sx} — worth adding.`;
  return {action:"add", reason};
}
/* Split a gene's allele pair for the roster table: more-dominant allele on top, recessive below (linear);
   incomplete/blend genes show the two alleles alphabetically. Returns display + base names for sorting. */
function genePairParts(g, pair){
  if(!pair || !pair.length) return {dom:"—", rec:"", domBase:"", recBase:"", homo:false};
  const x=pair[0], y=pair.length>1?pair[1]:pair[0]; let top=x, bot=y;
  if(g.mode==="linear"){ if((g.domRank[baseK(x)]||0)>(g.domRank[baseK(y)]||0)){ top=y; bot=x; } }   // lower rank = more dominant = on top
  else if(baseK(x)>baseK(y)){ top=y; bot=x; }
  const lab=a=>{ const b=baseK(a), lv=mutLevel(a), al=g.alleles.find(z=>z.k===b); return (al?al.name:b)+(lv?` ✦+${lv}`:""); };
  return {domBase:baseK(top), recBase:baseK(bot), dom:lab(top), rec:lab(bot), homo:baseK(top)===baseK(bot)&&mutLevel(top)===mutLevel(bot)};
}
/* the highest-level mutated allele a genotype carries for one gene (for labelling a step) */
function topMutAllele(geno, key){ const p=geno[key]||[]; if(!p.length) return null;
  const best=p.slice().sort((a,b)=>mutLevel(b)-mutLevel(a))[0]; return mutLevel(best)>0?{base:baseK(best), level:mutLevel(best)}:null; }
function mutationPlan(cats){
  const pool=cats.filter(Boolean);
  const ceil={}; GENES.forEach(g=>ceil[g.key]=0);
  pool.forEach(c=>{ const m=geneMaxLevels(c.geno); GENES.forEach(g=>{ if(m[g.key]>ceil[g.key]) ceil[g.key]=m[g.key]; }); });
  const ceilTotal=GENES.reduce((s,g)=>s+ceil[g.key],0);
  const needSex=!(pool.some(c=>c.sex==="F")&&pool.some(c=>c.sex==="M"));
  const res={ceilTotal, steps:[], seed:null, finalScore:0, needSex, noMut:ceilTotal===0};
  if(res.noMut || res.needSex) return res;
  const opp=s=>s==="F"?"M":"F";
  const seed=pool.slice().sort((a,b)=>mutationScore(b.geno)-mutationScore(a.geno)||a.id-b.id)[0];
  res.seed={name:seed.name, sex:seed.sex, score:mutationScore(seed.geno)};
  const line=geneMaxLevels(seed.geno), used=new Set([seed.id]);
  const lineScore=()=>GENES.reduce((s,g)=>s+line[g.key],0);
  let guard=0;
  while(lineScore()<ceilTotal && guard++<pool.length+2){
    const firstCross=res.steps.length===0;   // the seed itself is a parent here, so its first mate must be opposite-sex
    let best=null,bestGain=0,bestAdds=null;
    pool.forEach(c=>{ if(used.has(c.id)) return; if(firstCross && c.sex!==opp(seed.sex)) return;
      const m=geneMaxLevels(c.geno); let gain=0, adds=[];
      GENES.forEach(g=>{ if(m[g.key]>line[g.key]){ gain+=m[g.key]-line[g.key]; const t=topMutAllele(c.geno,g.key); adds.push({gene:g.key, level:m[g.key], base:t?t.base:""}); } });
      if(gain>bestGain){ bestGain=gain; best=c; bestAdds=adds; }
    });
    if(!best) break;
    used.add(best.id); bestAdds.forEach(a=>line[a.gene]=a.level);
    res.steps.push({partner:best.name, partnerSex:best.sex, gain:bestGain, adds:bestAdds, scoreAfter:lineScore()});
  }
  // each kept pup becomes the next parent, so it must be opposite-sex to the NEXT cross's partner
  res.steps.forEach((s,i)=>{ s.keepPupSex = (i+1<res.steps.length) ? opp(res.steps[i+1].partnerSex) : null; });
  res.finalScore=lineScore();
  res.incomplete = res.finalScore<ceilTotal;   // couldn't chain everything (e.g. all remaining ✦ on the seed's own sex)
  return res;
}

/* ---- colour blend swatch (interpolate two shade hexes) ---- */
function mixHex(h1,h2){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(h1), b=p(h2), m=a.map((v,i)=>Math.round((v+b[i])/2));
  return "#"+m.map(v=>v.toString(16).padStart(2,"0")).join("");
}
function shadeSwatch(sh){ return SHADE_HEX[sh]?`<span class="swatch" style="background:${SHADE_HEX[sh]}"></span>`:""; }
/* Format a phenotype label (allele key(s), possibly mutation-marked / "a + b") for display. */
function labelText(lab){ return String(lab).split(" + ").map(x=>{ const l=mutLevel(x); return baseK(x)+(l?(" ✦+"+l):""); }).join(" + "); }
function blendSwatch(a,b){
  const ha=SHADE_HEX[a], hb=SHADE_HEX[b]; if(!ha||!hb) return "";
  return `<span class="swatch" style="background:${a===b?ha:mixHex(ha,hb)}"></span>`;
}

    return r; } }catch(e){} return {cats:[], seq:1}; }

   UI
   ========================================================================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const groupCls=g=>g==="body"?"grp-body":g==="color"?"grp-color":"grp-pattern";
let TAB="nichelings", editId=null, breed={mom:null,dad:null,includeSideline:true,includeRetired:false};
let rosterSort={key:"name",dir:1}, rosterCollapsed=null;   // roster table: sort col/dir + collapsed group keys (null → default)
/* unified breeding finder state — a query builder (persists across re-renders):
   breedConds: [{gene, base, mutMin:num|null, mutMax:num|null, inherit:'carry'|'show', zyg:'either'|'homo'|'hetero'}]
     one target condition per allele; each selected gene type gets its own section of these rows.
   breedGenesSel: Set of gene keys chosen (each shows an allele-target section)
   breedGeneMode: 'all'|'any' across gene types (global)
   breedAlleleModeByGene: { geneKey: 'all'|'any' } — how a gene's own allele rows combine (per section)
   breedOpt: Set of optimise keys (ability names + '__mut'); null → all abilities
   breedMode: 'real'|'plan'|'both' (single-gen pairings / multi-gen plan / both)
   breedMin/breedMax: { statKey: number } per-stat filters on the pup's expected value ('__mut' = mutation) */
let breedConds=[], breedGenesSel=null, breedGeneMode="all", breedAlleleModeByGene={}, breedOpt=null, breedMode="real", breedMin={}, breedMax={}, breedWho="__any", breedMutMode="shown";
const amode=gk=>breedAlleleModeByGene[gk]||"all";   // breedMutMode: 'shown'|'carried' — how the ✦ Mutation metric/filter counts mutation
/* A nicheling's status: "active" (in your tribe), "sideline" (not in the tribe yet but kept on the
   bench — available for breeding), or "retired" (archived — can be brought back). Active is always in
   the breeding pool; sideline is in by default (toggle on) and retired is out by default (toggle off). */
const activeCats=()=>DB.cats.filter(c=>c.status==="active");
const breedingPool=()=>DB.cats.filter(c=> c.status==="active"
  || (breed.includeSideline && c.status==="sideline")
  || (breed.includeRetired  && c.status==="retired"));

const TABS=[["nichelings","🐾 My nichelings"],["breeding","💞 Breeding"],["retire","🧹 Retire"],["release","🕊️ Release"],["genes","📖 Gene reference"],["sync","☁︎ Sync"]];
function renderTabs(){
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${TAB===k?"on":""}" data-tab="${k}">${l}</button>`).join("");
  $$("#tabs .tab").forEach(b=>b.onclick=()=>{ TAB=b.dataset.tab; showTab(); });
}
function showTab(){
  renderTabs();
  ["nichelings","breeding","retire","release","genes","sync"].forEach(k=>$("#view-"+k).classList.toggle("hide", k!==TAB));
  if(TAB==="nichelings") renderNichelings();
  if(TAB==="breeding") renderBreeding();
  if(TAB==="retire") renderRetire();
  if(TAB==="release") renderRelease();
  if(TAB==="genes") renderGenes();
  if(TAB==="sync") renderSync();
}

/* ---------- ability chips ---------- */
function abilityChips(totals){
  const items=ABILITIES.filter(a=>totals[a]).map(a=>`<span class="a">${AB_SHORT[a]} <b>+${totals[a]}</b></span>`);
  return items.length?`<div class="abil">${items.join("")}</div>`:`<div class="abil"><span class="a muted">no ability bonuses</span></div>`;
}

/* ---------- expressed phenotype summary for a nicheling ---------- */
function phenoSummary(geno){
  const ph=phenotype(geno);
  const parts=GENES.map(g=>{
    if(ph._inactive[g.key]) return "";
    const ex=ph[g.key]; let txt, sw="";
    if(ex.kind==="single"){ const bk=baseK(ex.allele), lv=mutLevel(ex.allele); txt=bk+(lv?" ✦+"+lv:""); if(g.key==="eyecolor"&&EYECOL_HEX[bk]) sw=`<span class="swatch" style="background:${EYECOL_HEX[bk]}"></span>`; }
    else { const a0=baseK(ex.alleles[0]),a1=baseK(ex.alleles[1]); txt=a0===a1?a0:(a0+" + "+a1); sw=blendSwatch(a0,a1); }
    return `<span class="pill">${sw}<span class="muted">${g.label}:</span> ${esc(txt)}</span>`;
  });
  return parts.join("");
}

/* =========================================================================
   TAB: My nichelings
   ========================================================================= */
/* Roster table: Quick view · Stats (8 abilities + total + ✦ mutation bonus) · Genes (ability genes) ·
   Appearance (cosmetic genes). Column groups collapse to a strip; every stat/gene column sorts. */
function qvCell(c){ const t=abilityTotals(c.geno), tot=statTotal(c.geno), mb=mutBonus(c.geno);
  const top=ABILITIES.filter(a=>t[a]).sort((x,y)=>t[y]-t[x]).map(a=>`${AB_SHORT[a]} +${t[a]}`).join(" · ")||"no ability bonuses";
  return `${esc(top)} <span class="muted">· Σ${tot} · ✦+${mb} mut</span>`; }
function rosterSortVal(c, key){
  if(key==="name") return (c.name||"").toLowerCase();
  if(key==="total") return statTotal(c.geno);
  if(key==="mut") return mutBonus(c.geno);
  if(key.slice(0,3)==="ab:") return abilityTotals(c.geno)[key.slice(3)]||0;
  if(key.slice(0,4)==="dom:"||key.slice(0,4)==="rec:"){ const gk=key.slice(4), g=GENE_BY_KEY[gk];
    const p=genePairParts(g, (c.geno||{})[gk]); return ((key.slice(0,4)==="dom:"?p.domBase:p.recBase)||"").toLowerCase(); }
  return 0;
}
function rosterGroups(){
  const stat=GENES.filter(g=>ABILITY_GENE_KEYS.indexOf(g.key)>=0), appr=GENES.filter(g=>ABILITY_GENE_KEYS.indexOf(g.key)<0);
  return [
    {key:"quick", label:"Quick view", cols:[{kind:"qv", label:"At a glance"}]},
    {key:"stats", label:"Stats", cols:
      ABILITIES.map(a=>({kind:"num", label:AB_SHORT[a], sortk:"ab:"+a, title:a}))
        .concat([{kind:"num", label:"Σ", sortk:"total", title:"Total ability bonuses"},
                 {kind:"num", label:"✦ Mut", sortk:"mut", title:"Total mutation bonus to stats"}])},
    {key:"genes", label:"Genes", cols: stat.map(g=>({kind:"gene", gene:g, label:g.label}))},
    {key:"appear", label:"Appearance", cols: appr.map(g=>({kind:"gene", gene:g, label:g.label}))},
  ];
}
function rosterTableHTML(cats){
  if(rosterCollapsed===null) rosterCollapsed=new Set(["genes","appear"]);   // compact default: Quick view + Stats open
  const groups=rosterGroups();
  const sorted=cats.slice().sort((a,b)=>{ const va=rosterSortVal(a,rosterSort.key), vb=rosterSortVal(b,rosterSort.key);
    let cmp = (typeof va==="string") ? va.localeCompare(vb) : (va-vb);
    if(!cmp) cmp=(a.name||"").localeCompare(b.name||""); return cmp*rosterSort.dir; });
  const arr=k=>rosterSort.key!==k?`<span class="arr">↕</span>`:`<span class="arr">${rosterSort.dir>0?"↑":"↓"}</span>`;
  const aria=k=>rosterSort.key===k?(rosterSort.dir>0?"ascending":"descending"):"none";
  let h1=`<th class="nmc" rowspan="2" data-sortk="name" aria-sort="${aria("name")}" title="Sort by name">Name ${arr("name")}</th>`, h2="";
  groups.forEach(g=>{
    if(rosterCollapsed.has(g.key)){ h1+=`<th class="grp collapsed" rowspan="2" data-grp="${g.key}" title="Expand ${esc(g.label)}">${esc(g.label)}</th>`; return; }
    h1+=`<th class="grp" colspan="${g.cols.length}" data-grp="${g.key}" title="Collapse ${esc(g.label)}">${esc(g.label)}</th>`;
    g.cols.forEach((col,ci)=>{ const gs=ci===0?" grp-start":"";
      if(col.kind==="gene"){ const gk=col.gene.key;
        h2+=`<th class="dualh${gs}" title="${esc(col.gene.label)}"><div class="dhname">${esc(col.label)}</div><div class="dsorts">`+
          `<span class="dsort" data-sortk="dom:${gk}" aria-sort="${aria("dom:"+gk)}" title="Sort by dominant allele">Dom ${arr("dom:"+gk)}</span>`+
          `<span class="dsort" data-sortk="rec:${gk}" aria-sort="${aria("rec:"+gk)}" title="Sort by recessive allele">Rec ${arr("rec:"+gk)}</span></div></th>`;
      } else if(col.kind==="qv"){ h2+=`<th class="${gs}" data-sortk="total" aria-sort="${aria("total")}" title="Sort by total ability bonuses">${esc(col.label)} ${arr("total")}</th>`;
      } else { h2+=`<th class="num${gs}" data-sortk="${col.sortk}" aria-sort="${aria(col.sortk)}" title="Sort by ${esc(col.title)}">${esc(col.label)} ${arr(col.sortk)}</th>`; }
    });
  });
  h1+=`<th rowspan="2">Actions</th>`;
  const body=sorted.map(c=>{
    let row=`<td class="nmc" data-id="${c.id}">${esc(c.name)} <span class="muted" style="font-weight:400">${c.sex==="F"?"♀":c.sex==="M"?"♂":""}</span></td>`;
    groups.forEach(g=>{
      if(rosterCollapsed.has(g.key)){ row+=`<td class="strip" data-grp="${g.key}" title="Expand ${esc(g.label)}">▸</td>`; return; }
      g.cols.forEach((col,ci)=>{ const gs=ci===0?" grp-start":"";
        if(col.kind==="gene"){ const p=genePairParts(col.gene, (c.geno||{})[col.gene.key]);
          row+=`<td class="gcell${gs}"><span class="g-dom${p.homo?" g-homo":""}">${esc(p.dom)}</span><span class="g-rec">${p.homo?"〃":esc(p.rec)}</span></td>`;
        } else if(col.kind==="qv"){ row+=`<td class="qv${gs}">${qvCell(c)}</td>`; }
        else { const v=rosterSortVal(c, col.sortk); row+=`<td class="num${gs}">${v?esc(String(v)):"·"}</td>`; }
      });
    });
    row+=`<td class="rowact">`+
      `<button class="btn sm gray edit" data-id="${c.id}" title="Edit">✏️</button>`+
      `<button class="btn sm gray clone" data-id="${c.id}" title="Duplicate">⧉</button>`+
      `<button class="btn sm gray toSide" data-id="${c.id}" title="Move to sidelines">🪑</button>`+
      `<button class="btn sm gray retire1" data-id="${c.id}" title="Retire">🗂</button>`+
      `<button class="btn sm gray del" data-id="${c.id}" title="Delete">🗑</button></td>`;
    return `<tr>${row}</tr>`;
  }).join("");
  return `<div class="rtbl"><table><thead><tr>${h1}</tr><tr>${h2}</tr></thead><tbody>${body}</tbody></table></div>`
    +`<p class="muted" style="font-size:11px;margin:6px 2px 0">Click a group header (Quick view · Stats · Genes · Appearance) to collapse it; click a column to sort. Gene cells show the dominant allele on top, recessive below (〃 = homozygous).</p>`;
}
function wireRosterTable(){
  $$("#view-nichelings .rtbl [data-grp]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const k=el.dataset.grp;
    if(rosterCollapsed.has(k)) rosterCollapsed.delete(k); else rosterCollapsed.add(k); renderNichelings(); });
  $$("#view-nichelings .rtbl [data-sortk]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const k=el.dataset.sortk;
    if(rosterSort.key===k) rosterSort.dir=-rosterSort.dir;
    else rosterSort={key:k, dir:(k==="name"||k.slice(0,4)==="dom:"||k.slice(0,4)==="rec:")?1:-1};
    renderNichelings(); });
}
function renderNichelings(){
  const v=$("#view-nichelings");
  const active=DB.cats.filter(c=>c.status==="active"), sideline=DB.cats.filter(c=>c.status==="sideline"), retired=DB.cats.filter(c=>c.status==="retired");
  const glyph=c=>c.sex==="F"?"♀":c.sex==="M"?"♂":"";
  const abLine=c=>{ const t=abilityTotals(c.geno);
    return ABILITIES.filter(a=>t[a]).sort((x,y)=>t[y]-t[x]).slice(0,4).map(a=>`${AB_SHORT[a]} +${t[a]}`).join(" · ")||"no ability bonuses"; };
  let html=`<div class="card"><div class="row" style="justify-content:space-between">
      <h2 style="margin:0"><span class="em">🐾</span> My nichelings <span class="muted" style="font-weight:400;font-size:13px">(${active.length})</span></h2>
      <div class="row">
        <button class="btn sm" id="addCat">+ Add to tribe</button>

        <button class="btn sm gray" id="fromCode">⌗ From code</button>
        <button class="btn sm gray" id="exp">⬇︎ Export</button>

        <input type="file" id="impFile" accept="application/json" class="hide">
      </div></div>`;
  if(!DB.cats.length) html+=`<p class="muted" style="margin:12px 0 0">No nichelings yet. Add one and set its two alleles per gene, then head to <b>Breeding</b> to predict a pairing. Use <b>+ Add sideline</b> for a nicheling you're eyeing but haven't taken into the tribe.</p>`;
  else if(!active.length) html+=`<p class="muted" style="margin:12px 0 0">No nichelings in your tribe yet — add one, bring one back from <b>Retired</b>, or <b>Add to tribe</b> a <b>Sideline</b> one below.</p>`;
  html+=`</div>`;
  html+=`<div id="editor"></div>`;   // editor sits above the table, so a just-added nicheling's form is right at the top
  if(active.length) html+=rosterTableHTML(active);
  if(sideline.length){

      <p class="muted" style="font-size:12px;margin:8px 0 10px">Not in your tribe yet, but <b>available everywhere for breeding</b> (parents, finders, best-mate). Record their genes; hit <b>Add to tribe</b> when you take one in.</p>
      <div class="nlist">`+sideline.slice().reverse().map(c=>{ const adv=sidelineAdvice(c, active);
        const advTag = adv.action==="add"?`<span class="adv-add">➕ Add to tribe</span>`

        return `<div class="nrow" data-id="${c.id}">
        <div class="grow"><div class="nm">${esc(c.name)} <span class="muted" style="font-weight:400">${glyph(c)}</span></div>
          <div class="ab">${abLine(c)}</div>
          <div class="sideadvice">${advTag} — ${esc(adv.reason)}</div></div>
        <button class="btn sm gray edit" data-id="${c.id}">✏️ Edit</button>
        <button class="btn sm gray tribe" data-id="${c.id}">➕ Add to tribe</button>
        <button class="btn sm gray del" data-id="${c.id}" title="Delete">🗑</button>
      </div>`; }).join("")+`</div></details>`;
  }
  if(retired.length){
    html+=`<details class="retired-box"><summary>🗂 Retired <span class="muted" style="font-weight:400;font-size:13px">(${retired.length})</span></summary>
      <p class="muted" style="font-size:12px;margin:8px 0 10px">Archived — kept out of breeding by default. Bring one back to use it again, or delete it for good.</p>
      <div class="nlist">`+retired.slice().reverse().map(c=>`<div class="nrow" data-id="${c.id}">
        <div class="grow"><div class="nm">${esc(c.name)} <span class="muted" style="font-weight:400">${c.sex==="F"?"♀":c.sex==="M"?"♂":""}</span></div>
          <div class="ab">${abLine(c)}</div></div>
        <button class="btn sm gray unretire" data-id="${c.id}">↩︎ Bring back</button>
        <button class="btn sm gray del" data-id="${c.id}" title="Delete permanently">🗑</button>
      </div>`).join("")+`</div></details>`;
  }
  v.innerHTML=html;
  wireRosterTable();
  $("#addCat").onclick=()=>{ const c=newCat(); DB.cats.push(c); save(DB); editId=c.id; renderNichelings(); };

  if(editId!=null) renderEditor();
}

function renderEditor(){
  const c=DB.cats.find(x=>x.id===editId); if(!c) return;
  const groups=[["body","Body & abilities"],["color","Colours"],["pattern","Pattern & mane"]];
  let html=`<div class="card"><div class="row" style="justify-content:space-between">
      <h2 style="margin:0">✏️ Editing: ${esc(c.name)}</h2>
      <button class="btn sm" id="closeEd">Done</button></div>
    <div class="row" style="margin:10px 0">
      <label>Name <input type="text" id="edName" value="${esc(c.name)}" style="width:180px"></label>
      <label>Sex <select id="edSex"><option value="?" ${c.sex==="?"?"selected":""}>—</option><option value="F" ${c.sex==="F"?"selected":""}>♀ Female</option><option value="M" ${c.sex==="M"?"selected":""}>♂ Male</option></select></label>
    </div>`;
  html+=abilityChips(abilityTotals(c.geno));
  html+=`<div class="row" style="margin:12px 0 2px;align-items:flex-end">
      <label style="flex:1;min-width:220px">Gene code <input type="text" id="edCode" value="${genoToCode(c.geno)}" style="width:100%;font-family:ui-monospace,monospace"></label>
      <button class="btn sm gray" id="copyCode">Copy</button>
      <button class="btn sm gray" id="applyCode">Apply</button>
    </div>
    <p class="muted" style="font-size:11.5px;margin:0 0 4px">Copy to save/share this nicheling as one string; paste a code and Apply to load a whole genome. The <b>✦</b> number beside an allele is its <b>mutation level</b> — it adds that much to the allele's bonus (0 = none, stacks), and is inherited.</p>`;
  groups.forEach(([grp,title])=>{
    html+=`<h3 style="font-size:13px;color:var(--muted);margin:14px 0 6px">${title}</h3><div class="genogrid">`;
    GENES.filter(g=>g.group===grp).forEach(g=>{
      const pair=c.geno[g.key]||[g.alleles[0].k,g.alleles[0].k];
      const opts=a=>g.alleles.map(al=>`<option value="${esc(al.k)}" ${al.k===baseK(a)?"selected":""}>${esc(al.name)}</option>`).join("");
      const alrow=i=>`<div class="al"><select data-g="${g.key}" data-i="${i}">${opts(pair[i])}</select>`+
        (g.mode==="incomplete"?"":`<input type="number" class="mutn" min="0" step="1" value="${mutLevel(pair[i])}" data-mut="${g.key}" data-mi="${i}" title="Mutation level — adds +N to this allele's bonus (0 = none)">`)+`</div>`;
      html+=`<div class="slot ${groupCls(grp)}"><div class="nm">${g.label} <span style="font-weight:400">· ${g.mode==="incomplete"?"blend":"dominant/recessive"}</span></div>
        <div class="sel">${alrow(0)}${alrow(1)}</div></div>`;
    });
    html+=`</div>`;
  });
  html+=`</div>`;
  $("#editor").innerHTML=html;
  $("#closeEd").onclick=()=>{ editId=null; renderNichelings(); };
  $("#edName").oninput=e=>{ c.name=e.target.value; save(DB); };
  $("#edSex").onchange=e=>{ c.sex=e.target.value; save(DB); };
  const refreshTotals=()=>{ const ab=$("#editor .abil"); if(ab) ab.outerHTML=abilityChips(abilityTotals(c.geno));
    const ec=$("#edCode"); if(ec) ec.value=genoToCode(c.geno); };
  $$("#editor select[data-g]").forEach(s=>s.onchange=()=>{
    const g=s.dataset.g, i=+s.dataset.i; c.geno[g][i]=withMut(s.value, isMut(c.geno[g][i])); save(DB); refreshTotals();
  });
  $$("#editor input[data-mut]").forEach(inp=>inp.oninput=()=>{
    const g=inp.dataset.mut, i=+inp.dataset.mi; c.geno[g][i]=withMut(c.geno[g][i], inp.value); save(DB); refreshTotals();
  });
  $("#copyCode").onclick=()=>{ const t=$("#edCode"); t.select();
    try{ navigator.clipboard.writeText(t.value); }catch(e){ try{ document.execCommand("copy"); }catch(x){} }
    const b=$("#copyCode"), o=b.textContent; b.textContent="Copied!"; setTimeout(()=>b.textContent=o,1200); };
  $("#applyCode").onclick=()=>{ const geno=codeToGeno($("#edCode").value);
    if(!geno){ alert("That doesn't look like a valid gene code (should start with NB1-)."); return; }
    c.geno=geno; save(DB); renderEditor(); $("#editor .abil")&&($("#editor .abil").outerHTML=abilityChips(abilityTotals(c.geno))); };
}

function exportRoster(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="niche-roster.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importRoster(e){
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const r=JSON.parse(rd.result); if(r&&Array.isArray(r.cats)){ DB=r; DB.seq=DB.seq||(Math.max(0,...DB.cats.map(c=>c.id))+1); save(DB); renderNichelings(); } else alert("Not a valid roster file."); }catch(x){ alert("Could not read that file."); } };
  rd.readAsText(f); e.target.value="";
}

   TAB: Breeding

function renderBreeding(){
  const v=$("#view-breeding");
  if(!DB.cats.length){ v.innerHTML=`<div class="card"><p class="muted">Add at least one nicheling under <b>My nichelings</b> first. You can breed a nicheling with itself or with any other.</p></div>`; return; }
  const retiredCount=DB.cats.filter(c=>c.status==="retired").length;
  const sidelineCount=DB.cats.filter(c=>c.status==="sideline").length;
  const tag=c=>c.status==="sideline"?" · sideline":c.status==="retired"?" · retired":"";
  const bar=()=>{ const parts=[];
    if(sidelineCount) parts.push(`<label class="row" style="gap:5px;font-weight:600;font-size:12px"><input type="checkbox" class="incSideline" ${breed.includeSideline?"checked":""}> sideline (${sidelineCount})</label>`);

    $$("#view-breeding .incRetired").forEach(cb=>cb.onchange=e=>{ breed.includeRetired=e.target.checked; renderBreeding(); }); };
  const pool=breedingPool();
  if(typeof breedWho!=="undefined" && breedWho!=null && breedWho!=="__any" && !pool.some(c=>c.id===breedWho)) breedWho="__any";  // stale Restrict target no longer in pool → back to Any
  if(!pool.length){
    v.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0"><span class="em">💞</span> Breeding</h2>${bar()}</div>

    wireInc(); return;
