  const seg=(cls,val,opts)=>opts.map(([v2,l])=>`<button class="btn sm ${val===v2?"":"gray"} ${cls}" data-v="${v2}">${l}</button>`).join("");
  const geneChip=g=>`<button class="btn sm ${breedGenesSel.has(g.key)?"":"gray"} bgene" data-g="${g.key}">${esc(g.label)}</button>`;

  let html=`<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0"><span class="em">💞</span> Find &amp; rank pairings</h2>${bar()}</div>
    <p class="muted" style="font-size:12px;margin:8px 0 0">A breeding query: tick which stats to <b>optimise</b> (and optional min/max), add <b>gene / allele targets</b> with per-target mutation &amp; inheritance, and pick whether to show single-pairing options, a multi-generation plan, or both. Everything combines.</p>

    <h3 style="font-size:12px;color:var(--muted);margin:12px 0 4px">OPTIMISE &amp; STAT LIMITS</h3>
    <table class="optgrid" style="border-collapse:collapse"><tr style="font-size:11px;color:var(--muted)"><td></td><td style="padding:0 6px">Rank</td><td style="padding:0 6px">Min</td><td style="padding:0 6px">Max</td></tr>
      ${ABILITIES.map(a=>optRow(a,a)).join("")}
      ${optRow("__mut","✦ Mutation")}
    </table>
    <div class="row" style="gap:6px;align-items:center;margin-top:4px"><span class="muted" style="font-size:11px">✦ Mutation counts:</span>${seg("bMutMode",breedMutMode,[["shown","Shown"],["carried","Carried"]])}
      <span class="muted" style="font-size:10.5px">— <b>Shown</b> = ✦ the pup expresses; <b>Carried</b> = ✦ on any copy, even masked (to stack a line over generations)</span></div>
    <div class="muted" style="font-size:10.5px;margin-top:2px">Min/Max bound each pup's <b>expected (average)</b> value — recessive traits &amp; ✦ mutations average well under 1.</div>

    <h3 style="font-size:12px;color:var(--muted);margin:14px 0 4px">RESTRICT</h3>
    <div class="row"><label>Restrict to <select id="bWho"><option value="__any">Any pairing</option>${pool.filter(c=>c.sex!=="?").map(c=>`<option value="${c.id}" ${breedWho==c.id?"selected":""}>${esc(c.name)} ${c.sex==="F"?"♀":"♂"}${tag(c)}</option>`).join("")}</select></label></div>

    <h3 style="font-size:12px;color:var(--muted);margin:14px 0 4px">TARGET TRAITS</h3>
    <div class="row" style="gap:6px;flex-wrap:wrap;align-items:center"><span class="muted" style="font-size:11.5px">Gene type:</span>${GENES.map(geneChip).join("")}
      <span class="muted" style="font-size:11.5px;margin-left:6px">match across gene types:</span>${seg("bGeneMode",breedGeneMode,[["all","All"],["any","Any"]])}</div>
    <p class="muted" style="font-size:11px;margin:6px 0 0">Pick one or more gene types — each opens a section below. Add one row per allele you want: its ✦ range (blank = any), Carries vs Shows, and zygosity. “＋ Add allele” commits the row and opens a fresh one.</p>
    <div id="bSections" style="margin-top:6px"></div>

    <div class="row" style="gap:6px">${seg("bMode",breedMode,[["real","Real possibilities"],["plan","Multi-gen plans"],["both","Both"]])}</div>
    <div id="bOut" class="muted" style="margin-top:10px;font-size:13px"></div>
  </div>`;

  const opt2=(sel)=>pool.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)}${c.sex!=="?"?(c.sex==="F"?" ♀":" ♂"):""}${tag(c)}</option>`).join("");
  if(!pool.some(c=>c.id===breed.mom)) breed.mom=pool[0].id;
  if(!pool.some(c=>c.id===breed.dad)) breed.dad=pool[Math.min(1,pool.length-1)].id;
  html+=`<div class="card">
    <h2 style="margin:0">🔬 Predict one pairing</h2>
    <div class="row" style="margin-top:8px">
      <label>Parent A <select id="selMom">${opt2(breed.mom)}</select></label>
      <label>Parent B <select id="selDad">${opt2(breed.dad)}</select></label>
      <button class="btn sm" id="addPup">➕ Save a possible pup</button>
    </div>
    <p class="muted" style="font-size:12px;margin:8px 0 0">Each pup gets one allele per gene from each parent (50/50). Percentages below are the chance a pup <b>shows</b> that trait. Click a ranked pairing above to load it here.</p>
  </div>`;
  html+=`<div id="breedOut"></div>`;
  v.innerHTML=html;

  wireInc();
  // optimise grid
  $$("#view-breeding .oRank").forEach(cb=>cb.onchange=()=>{ const s=cb.dataset.s; if(cb.checked) breedOpt.add(s); else breedOpt.delete(s); runBreedSearch(); });
  const numHandler=(cls,store)=>$$("#view-breeding ."+cls).forEach(inp=>inp.oninput=()=>{ const s=inp.dataset.s, val=inp.value.trim();

    else breedGenesSel.add(g);
    b.classList.toggle("gray"); renderTargetSections(); runBreedSearch(); });
  // segmented toggles (across-gene match + show mode)
  const wireSeg=(cls,set)=>$$("#view-breeding ."+cls).forEach(b=>b.onclick=()=>{ set(b.dataset.v); $$("#view-breeding ."+cls).forEach(x=>x.classList.toggle("gray", x.dataset.v!==b.dataset.v)); runBreedSearch(); });
  wireSeg("bGeneMode",v2=>breedGeneMode=v2); wireSeg("bMode",v2=>breedMode=v2); wireSeg("bMutMode",v2=>breedMutMode=v2);
  $("#bRun").onclick=runBreedSearch;
  $("#bClearT").onclick=()=>{ breedConds=[]; renderTargetSections(); runBreedSearch(); };
  renderTargetSections();
  // preview
  $("#selMom").onchange=e=>{ breed.mom=+e.target.value; renderBreedOut(); };
  $("#selDad").onchange=e=>{ breed.dad=+e.target.value; renderBreedOut(); };
  $("#addPup").onclick=()=>{ const mom=DB.cats.find(c=>c.id===breed.mom), dad=DB.cats.find(c=>c.id===breed.dad); if(!mom||!dad) return;
    const c=newCat("Pup of "+mom.name+" × "+dad.name); c.geno=sampleOffspring(mom.geno, dad.geno); DB.cats.push(c); save(DB);
    alert('Added "'+c.name+'" to My nichelings — one random possible outcome of this pairing.'); };
  renderBreedOut();
  runBreedSearch();
}

/* Breeding needs one ♀ and one ♂. */
const canPair=(a,b)=>(a.sex==="F"&&b.sex==="M")||(a.sex==="M"&&b.sex==="F");
const hasFM=list=>list.some(c=>c.sex==="F")&&list.some(c=>c.sex==="M");
const needSexMsg='<p class="muted">Pairings need one ♀ and one ♂ — set each nicheling\'s sex in its editor (the ♀/♂ dropdown).</p>';
const mutOk=(lv,req)=>req==="yes"?lv>0:req==="no"?lv===0:true;   // legacy yes/no helper (still used by a few call sites)
const mutInRange=(lv,cond)=>(cond.mutMin==null||lv>=cond.mutMin)&&(cond.mutMax==null||lv<=cond.mutMax);  // ✦ level within [min,max]; blank = open

function offspringCarryProb(gene, momPair, dadPair, alleleBase){
  const gd=offspringGenotypeDist(momPair&&momPair.length?momPair:[gene.alleles[0].k,gene.alleles[0].k], dadPair&&dadPair.length?dadPair:[gene.alleles[0].k,gene.alleles[0].k]);
  let p=0; for(const key in gd){ if(key.split("|").some(x=>baseK(x)===alleleBase)) p+=gd[key]; } return p;
}
function offspringShowProb(gene, momPair, dadPair, alleleBase){
  const {pheno}=offspringPhenotypeDist(gene, momPair&&momPair.length?momPair:[gene.alleles[0].k,gene.alleles[0].k], dadPair&&dadPair.length?dadPair:[gene.alleles[0].k,gene.alleles[0].k]);
  let p=0; pheno.forEach(ph=>{ if(ph.label.split(" + ").map(baseK).includes(alleleBase)) p+=ph.prob; }); return p;
}
function offspringMutExpected(momGeno, dadGeno, mode){
  // mode 'shown' (default): count only the ✦ that actually SHOWS (same rule as the ability outlook) —
  //   linear → the expressed (more-dominant) copy; incomplete → both blend copies show, take the higher.
  // mode 'carried': count the highest ✦ on EITHER inherited copy, even if masked — the mutation the pup
  //   can pass on / stack over generations (breeding-stock value), regardless of whether it shows.
  const carried = mode==="carried";
  let e=0; GENES.forEach(g=>{ const gd=offspringGenotypeDist(momGeno[g.key]||[g.alleles[0].k,g.alleles[0].k], dadGeno[g.key]||[g.alleles[0].k,g.alleles[0].k]);
    for(const key in gd){ const copies=key.split("|");
      let lvl;
      if(carried) lvl=Math.max(...copies.map(mutLevel));
      else { const ex=expressGene(g,copies); lvl = ex.kind==="single" ? mutLevel(ex.allele) : Math.max(...ex.alleles.map(mutLevel)); }
      e+=gd[key]*lvl; } }); return e;
}
/* Does one offspring genotype (two full allele strings) satisfy a target condition?
   cond = {base, mutMin, mutMax, inherit:'carry'|'show', zyg:'either'|'homo'|'hetero'}.
   Zygosity counts how many of the two slots are the target allele (within the ✦ range);
   inheritance 'show' additionally requires the target to be the EXPRESSED phenotype. */
function condSatisfied(gene, copies, cond){
  const cnt=copies.filter(a=>baseK(a)===cond.base && mutInRange(mutLevel(a),cond)).length;
  const zyg=cond.zyg||"either";
  if(zyg==="homo"){ if(cnt<2) return false; }        // both slots are the target
  else if(zyg==="hetero"){ if(cnt!==1) return false; } // exactly one slot
  else { if(cnt<1) return false; }                    // either → at least one
  if(cond.inherit==="show"){ const ex=expressGene(gene, copies); const shown = ex.kind==="single"?[ex.allele]:ex.alleles;
    return shown.some(a=>baseK(a)===cond.base && mutInRange(mutLevel(a),cond)); }
  return true;   // carry → zygosity/count already satisfied
}
/* P(a pup meets [all|any of] a gene's target conditions), from the pairing's genotype distribution for that gene. */
function geneConditionProb(gene, momPair, dadPair, conds, mode){
  const mp=momPair&&momPair.length?momPair:[gene.alleles[0].k,gene.alleles[0].k];
  const dp=dadPair&&dadPair.length?dadPair:[gene.alleles[0].k,gene.alleles[0].k];
  const gd=offspringGenotypeDist(mp,dp); let p=0;
  for(const key in gd){ const copies=key.split("|");
    const sats=conds.map(c=>condSatisfied(gene,copies,c));
    if(mode==="all"?sats.every(Boolean):sats.some(Boolean)) p+=gd[key]; }
  return p;
}

/* Per-gene-type target sections: one appears for each selected gene type, holding a stack of allele-target
   rows (allele + ✦min/max + Carries/Shows + zygosity), a per-section All/Any, and a trailing "＋ Add" row. */
const alleleOptions=(g,sel)=>g.alleles.map(a=>`<option value="${esc(a.k)}" ${a.k===sel?"selected":""}>${esc(a.name)}</option>`).join("");
const INH_OPTS=v=>`<option value="carry" ${v==="carry"||v==null?"selected":""}>Carries</option><option value="show" ${v==="show"?"selected":""}>Shows</option>`;
const ZYG_OPTS=v=>`<option value="either" ${(v||"either")==="either"?"selected":""}>Either</option><option value="homo" ${v==="homo"?"selected":""}>Homozygous</option><option value="hetero" ${v==="hetero"?"selected":""}>Heterozygous</option>`;
const bMutCells=(minCls,maxCls,c)=>`<span class="muted" style="font-size:11px">✦</span>`+
  `<input type="number" min="0" class="${minCls}" value="${c&&c.mutMin!=null?c.mutMin:""}" placeholder="min" title="min ✦ (blank = any)" style="width:46px">`+
  `<input type="number" min="0" class="${maxCls}" value="${c&&c.mutMax!=null?c.mutMax:""}" placeholder="max" title="max ✦ (blank = any)" style="width:46px">`;
function targetRowHTML(g,c,idx){
  return `<div class="row brow" data-i="${idx}" style="gap:5px;align-items:center;margin-top:5px;flex-wrap:wrap">
    <select class="bcAllele" style="min-width:130px">${alleleOptions(g,c.base)}</select>
    ${bMutCells("bcMin","bcMax",c)}
    <select class="bcInherit">${INH_OPTS(c.inherit)}</select>
    <select class="bcZyg">${ZYG_OPTS(c.zyg)}</select>
    <button class="btn sm gray bcRemove" title="Remove this target">✕</button></div>`;
}
function draftRowHTML(g){
  return `<div class="row bdraft" data-g="${g.key}" style="gap:5px;align-items:center;margin-top:5px;flex-wrap:wrap">
    <select class="bdAllele" style="min-width:130px">${alleleOptions(g,g.alleles[0].k)}</select>
    ${bMutCells("bdMin","bdMax",null)}
    <select class="bdInherit">${INH_OPTS("carry")}</select>
    <select class="bdZyg">${ZYG_OPTS("either")}</select>
    <button class="btn sm bdAdd">＋ Add allele</button></div>`;
}
const bNum=v=>{ v=(v||"").trim(); if(v==="") return null; const n=parseInt(v,10); return isNaN(n)?null:Math.max(0,n); };
function renderTargetSections(){
  const host=$("#bSections"); if(!host) return;
  const sel=GENES.filter(g=>breedGenesSel && breedGenesSel.has(g.key));
  if(!sel.length){ host.innerHTML=`<span class="muted" style="font-size:12px">No gene types picked — every pairing is ranked by your Optimise choices. Pick a gene type above to target specific alleles.</span>`; return; }
  host.innerHTML=sel.map(g=>{
    const rows=breedConds.map((c,i)=>({c,i})).filter(x=>x.c.gene===g.key);
    const segBtns=[["all","All"],["any","Any"]].map(([v,l])=>`<button class="btn sm ${amode(g.key)===v?"":"gray"} bAM" data-g="${g.key}" data-v="${v}">${l}</button>`).join("");
    const matchUI = rows.length>1 ? `<span class="row" style="gap:4px;align-items:center"><span class="muted" style="font-size:11px">match these:</span>${segBtns}</span>` : "";
    return `<div class="bsection" data-g="${g.key}" style="margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px">
      <div class="row" style="justify-content:space-between;align-items:center;gap:8px"><b style="font-size:12.5px">${esc(g.label)} alleles</b>${matchUI}</div>
      ${rows.map(x=>targetRowHTML(g,x.c,x.i)).join("")}
      ${draftRowHTML(g)}</div>`;
  }).join("");
  $$("#bSections .bAM").forEach(b=>b.onclick=()=>{ breedAlleleModeByGene[b.dataset.g]=b.dataset.v;
    $$("#bSections .bsection[data-g='"+b.dataset.g+"'] .bAM").forEach(x=>x.classList.toggle("gray", x.dataset.v!==b.dataset.v)); runBreedSearch(); });
  $$("#bSections .brow").forEach(row=>{ const i=+row.dataset.i;
    const upd=()=>{ const c=breedConds[i]; if(!c) return; c.base=row.querySelector(".bcAllele").value;
      c.mutMin=bNum(row.querySelector(".bcMin").value); c.mutMax=bNum(row.querySelector(".bcMax").value);
      c.inherit=row.querySelector(".bcInherit").value; c.zyg=row.querySelector(".bcZyg").value; runBreedSearch(); };
    row.querySelectorAll("select").forEach(s=>s.onchange=upd);
    row.querySelectorAll("input").forEach(inp=>inp.oninput=upd);
    row.querySelector(".bcRemove").onclick=()=>{ breedConds.splice(i,1); renderTargetSections(); runBreedSearch(); };
  });
  $$("#bSections .bdraft").forEach(row=>{ row.querySelector(".bdAdd").onclick=()=>{ const gk=row.dataset.g;
    breedConds.push({gene:gk, base:row.querySelector(".bdAllele").value,
      mutMin:bNum(row.querySelector(".bdMin").value), mutMax:bNum(row.querySelector(".bdMax").value),
      inherit:row.querySelector(".bdInherit").value, zyg:row.querySelector(".bdZyg").value});
    renderTargetSections(); runBreedSearch(); }; });
}

function runBreedSearch(){
  const out=$("#bOut"); if(!out) return;
  const pool=breedingPool();
  const whoId = (typeof breedWho!=="undefined" && breedWho!=null) ? breedWho : "__any";
  if(!hasFM(pool)){ out.innerHTML=needSexMsg; return; }
  const byGene={}; breedConds.forEach(c=>{ (byGene[c.gene]||(byGene[c.gene]=[])).push(c); });
  const geneKeys=Object.keys(byGene);
  const opt=breedOpt||new Set(ABILITIES);   // honour an explicitly-emptied Optimise (score→0); only default when never set
  // candidate pairings
  let pairs=[];
  let me = whoId!=="__any" ? pool.find(c=>c.id===+whoId) : null;
  if(whoId!=="__any" && !me) breedWho="__any";   // Restrict target left the pool (include-toggle/delete/retire) → revert to Any silently
  if(me){
    if(me.sex==="?"){ out.innerHTML=`<p class="muted">Pick a nicheling with a set sex (♀/♂) under <b>Restrict</b>.</p>`; return; }
    const want=me.sex==="F"?"M":"F", mates=pool.filter(c=>c.id!==me.id&&c.sex===want);
    if(!mates.length){ out.innerHTML=`<p class="muted">No ${want==="F"?"♀":"♂"} mate for <b>${esc(me.name)}</b>.</p>`; return; }
    mates.forEach(m=>pairs.push([me,m]));
  } else { for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++){ if(canPair(pool[i],pool[j])) pairs.push([pool[i],pool[j]]); } }

  const rows=pairs.map(([a,b])=>{
    let joint=1;
    if(geneKeys.length){ const per=geneKeys.map(gk=>geneConditionProb(GENE_BY_KEY[gk], a.geno[gk], b.geno[gk], byGene[gk], amode(gk)));
      joint = breedGeneMode==="all" ? per.reduce((s,p)=>s*p,1) : 1-per.reduce((s,p)=>s*(1-p),1);
      if(!(joint>0)) return null; }
    const o=offspringAbilityOutlook(a.geno,b.geno), eMut=offspringMutExpected(a.geno,b.geno,breedMutMode);
    for(const s of ABILITIES){ if(breedMin[s]!=null && o.exp[s]<breedMin[s]-1e-9) return null; if(breedMax[s]!=null && o.exp[s]>breedMax[s]+1e-9) return null; }
    if(breedMin["__mut"]!=null && eMut<breedMin["__mut"]-1e-9) return null;
    if(breedMax["__mut"]!=null && eMut>breedMax["__mut"]+1e-9) return null;
    let score=ABILITIES.reduce((s,ab)=>opt.has(ab)?s+o.exp[ab]:s,0)+(opt.has("__mut")?eMut:0);
    const topStats=ABILITIES.filter(ab=>o.exp[ab]>0.05).sort((x,y)=>o.exp[y]-o.exp[x]).slice(0,4).map(ab=>`${AB_SHORT[ab]} ~+${o.exp[ab].toFixed(1)}`).join(" · ");
    const F=a.sex==="F"?a:b, M=a.sex==="F"?b:a;
    return {F:F.name,M:M.name,Fid:F.id,Mid:M.id,score,joint,topStats};
  }).filter(Boolean);
  // with explicit gene/allele targets, rank by how likely a pairing HITS them (stats tiebreak);
  // with no targets, rank by the Optimise score.
  rows.sort((x,y)=> geneKeys.length ? ((y.joint-x.joint)||(y.score-x.score)) : ((y.score-x.score)||(y.joint-x.joint)));

  let html="";
  if(breedMode==="real"||breedMode==="both"){
    const top=rows.slice(0,15);
    html+=`<div style="font-weight:700;margin:2px 0 6px">Real single-pairing options (${rows.length}):</div>`;
    if(!top.length){ const hasLimits=Object.keys(breedMin).length||Object.keys(breedMax).length;
      html+=`<p class="muted">No ♀×♂ pairing meets these targets/limits in one pairing.${geneKeys.length?" Try <b>Multi-gen plans</b> below — a recessive/homozygous outcome often needs two generations.":""}${hasLimits?" <br><span style=\"font-size:11px\">Min/Max apply to each pup's <b>expected (average)</b> value — rare traits &amp; ✦ mutations average well below 1, so a whole-number bound like “≥1” can exclude everything. Lower the bound to see chances.</span>":""}</p>`; }
    else { const byJoint=geneKeys.length>0, max=(byJoint?top[0].joint:top[0].score)||1;
      html+=top.map(r=>{ const metric=byJoint?r.joint:r.score, w=Math.max(2,Math.round(100*(max?metric/max:0))), tinfo=geneKeys.length?` <span class="muted" style="font-size:11px">🎯 ${r.joint*100>=0.5?Math.round(r.joint*100)+"%":"<1%"}</span>`:"";
        return `<div class="prob bpair" data-f="${r.Fid}" data-m="${r.Mid}" style="margin-bottom:0;cursor:pointer" title="Load in the preview below"><span class="nm2">${esc(r.F)} ♀ × ${esc(r.M)} ♂${tinfo}</span><span class="bar"><span style="width:${w}%"></span></span><span class="pv">~${r.score.toFixed(1)}</span></div>`+
          `<div class="muted" style="font-size:11.5px;margin:0 0 7px 150px">${esc(r.topStats)}</div>`; }).join(""); }
  }
  if(breedMode==="plan"||breedMode==="both"){
    if(breedMode==="both") html+=`<div style="height:8px"></div>`;
    html+= geneKeys.length ? targetPlanHTML(pool, byGene, geneKeys) : mutationPlanHTML(pool);
  }
  out.innerHTML=html;
  $$("#bOut .bpair").forEach(el=>el.onclick=()=>{ breed.mom=+el.dataset.f; breed.dad=+el.dataset.m;
    const sm=$("#selMom"),sd=$("#selDad"); if(sm) sm.value=breed.mom; if(sd) sd.value=breed.dad;
    renderBreedOut(); const bo=$("#breedOut"); try{ if(bo) bo.scrollIntoView({behavior:"smooth"}); }catch(e){} });
}

/* Multi-generation plan toward the target: gather every needed allele into one line (greedy, opposite-sex
   crosses), then note the extra homozygous cross a "shown" recessive needs. A rough roadmap — each cross is
   luck-based (keep a pup that inherited the allele). */
/* Human label for a target allele + its ✦ range, e.g. "Nimble Fingers ✦2–4" / "Bird Beak". */
function targetBaseLabel(c){ const g=GENE_BY_KEY[c.gene], al=g&&g.alleles.find(a=>a.k===c.base); const nm=al?al.name:c.base;
  if(c.mutMin==null&&c.mutMax==null) return nm;
  if(c.mutMin!=null&&c.mutMin===c.mutMax) return nm+" ✦"+c.mutMin;
  return nm+" ✦"+(c.mutMin!=null?c.mutMin:"")+"–"+(c.mutMax!=null?c.mutMax:""); }
/* Can ONE diploid genotype (two allele slots) satisfy a gene's target conditions under the given
   within-gene mode? Mirrors condSatisfied/expressGene so it agrees with the Real search: three
   different 'carry' bases on one gene, or two different 'show' bases on a linear gene, are impossible. */
function geneFeasible(gene, conds, mode){
  const levels=new Set([0,1]); conds.forEach(c=>{ if(c.mutMin!=null) levels.add(c.mutMin); if(c.mutMax!=null) levels.add(c.mutMax); });
  const copies=[]; gene.alleles.forEach(a=>levels.forEach(L=>copies.push(withMut(a.k,L))));
  for(let i=0;i<copies.length;i++) for(let j=i;j<copies.length;j++){
    const pair=[copies[i],copies[j]], sats=conds.map(c=>condSatisfied(gene,pair,c));
    if(mode==="all"?sats.every(Boolean):sats.some(Boolean)) return true;
  }
  return false;
}
function targetPlan(pool, byGene){
  // A nicheling has only two slots per gene, so some target sets can never coexist in one pup.
  // Flag those genes (per the section's own All/Any) and drop them from the gather so the plan can't
  // claim an impossible outcome (which would contradict the Real single-pairing search's "No pairing").
  const impossible=[];
  Object.keys(byGene).forEach(gk=>{ const g=GENE_BY_KEY[gk];
    if(g && !geneFeasible(g, byGene[gk], amode(gk))) impossible.push({gene:gk, label:g.label, bases:byGene[gk].map(targetBaseLabel)}); });
  const impSet=new Set(impossible.map(x=>x.gene));
  const carries=(cat,c)=>(cat.geno[c.gene]||[]).some(a=>baseK(a)===c.base && mutInRange(mutLevel(a),c));
  const ownsBase=(cat,c)=>(cat.geno[c.gene]||[]).some(a=>baseK(a)===c.base);
  // 'All' gene → gather every allele target; 'Any' gene → gather only the single one the pool supplies most.
  const needed=[]; Object.keys(byGene).forEach(gk=>{ if(impSet.has(gk)) return; const cs=byGene[gk];
    if(amode(gk)==="any" && cs.length>1){ let best=cs[0],bestN=-1; cs.forEach(c=>{ const n=pool.filter(cat=>carries(cat,c)).length; if(n>bestN){bestN=n;best=c;} }); needed.push(best); }
    else cs.forEach(c=>needed.push(c)); });
  const keyOf=c=>[c.gene,c.base,c.mutMin,c.mutMax,c.inherit,c.zyg].join("|");
  const uniq={}; needed.forEach(c=>uniq[keyOf(c)]=c); const conds=Object.values(uniq);
  if(!conds.length) return {ok:false, missing:[], impossible};
  // unreachable condition: distinguish "own no copy of the base at all" from "own it, wrong ✦ form"
  const missing=conds.filter(c=>!pool.some(cat=>carries(cat,c)))
    .map(c=>({c, hasBase: pool.some(cat=>ownsBase(cat,c))}));
  if(missing.length) return {ok:false, missing, impossible};
  const sexed=pool.filter(c=>c.sex==="F"||c.sex==="M");
  if(!sexed.length) return {ok:false, needSex:true, impossible};
  const coverage=cat=>new Set(conds.filter(c=>carries(cat,c)).map(keyOf));
  const all=new Set(conds.map(keyOf));
  let seed=sexed.slice().sort((a,b)=>coverage(b).size-coverage(a).size || a.id-b.id)[0];
  const line=coverage(seed), used=new Set([seed.id]), steps=[]; let lastSex=seed.sex;
  let guard=0;
  while([...all].some(k=>!line.has(k)) && guard++<pool.length+2){
    const want=lastSex==="F"?"M":"F";
    let best=null,bestGain=0,bestAdd=null;
    sexed.forEach(c=>{ if(used.has(c.id)||c.sex!==want) return; const add=[...coverage(c)].filter(k=>!line.has(k));
      if(add.length>bestGain){ bestGain=add.length; best=c; bestAdd=add; } });
    if(!best) break;
    used.add(best.id); bestAdd.forEach(k=>line.add(k));
    steps.push({partner:best.name, partnerSex:best.sex, adds:bestAdd.map(k=>targetBaseLabel(uniq[k]))});
    lastSex=want;
  }
  // each intermediate kept pup must be the sex the NEXT cross needs (opposite of that partner's sex)
  steps.forEach((s,i)=>{ const nx=steps[i+1]; s.keepPupSex = nx ? (nx.partnerSex==="F"?"M":"F") : null; });
  const covered=[...all].every(k=>line.has(k));
  // A homozygous cross is needed when the target explicitly wants two copies (zyg 'homo'), or when it's a
  // RECESSIVE linear allele 'shown' (the most-dominant linear allele and any incomplete/blend allele
  // already show from a single copy).
  const homo=conds.filter(c=>{ const g=GENE_BY_KEY[c.gene]; if(!g) return false;
      if((c.zyg||"either")==="homo") return true;
      return c.inherit==="show" && g.mode==="linear" && (g.domRank[c.base]||0)>0; })
    .map(c=>{ const g=GENE_BY_KEY[c.gene], al=g.alleles.find(a=>a.k===c.base); return (al?al.name:c.base); });
  return {ok:true, steps, covered, seed:{name:seed.name,sex:seed.sex}, homo, all:[...all], line:[...line], impossible};
}
function targetPlanHTML(pool, byGene, geneKeys){
  if(!hasFM(pool)) return needSexMsg;
  const plan=targetPlan(pool, byGene);
  const impHTML=(plan.impossible&&plan.impossible.length)?
    `<p class="muted" style="font-size:11.5px;margin:2px 0 6px;color:var(--warn)">⚠ These can't all appear in one nicheling (only two allele slots per gene): `+
      plan.impossible.map(x=>`<b>${esc(x.label)}</b> — ${x.bases.map(esc).join(", ")}`).join("; ")+
      `. Drop some, or set that section's <b>match</b> to <b>Any</b>, to plan the rest.</p>`:"";
  if(!plan.ok){
    if(plan.needSex) return needSexMsg;
    const nm=c=>targetBaseLabel(c);
    const none=(plan.missing||[]).filter(m=>!m.hasBase).map(m=>nm(m.c));
    const wrong=(plan.missing||[]).filter(m=>m.hasBase).map(m=>nm(m.c));
    let msg="";
    if(none.length) msg+=`<p class="muted">You don't own <b>${none.map(esc).join(", ")}</b> at all yet — acquire or breed ${none.length>1?"those alleles":"that allele"} first, then this can plan a path.</p>`;
    if(wrong.length) msg+=`<p class="muted">You own <b>${wrong.map(esc).join(", ")}</b>, but not at the ✦-mutation state you asked for — breed a copy at that mutation level first.</p>`;
    if(!msg && !impHTML) msg=`<p class="muted">Nothing to plan.</p>`;
    return `<div style="font-weight:700;margin:2px 0 4px">Multi-gen plan</div>${impHTML}${msg}`;
  }
  let html=`<div style="font-weight:700;margin:2px 0 4px">Multi-gen plan toward your targets</div>${impHTML}`;
  html+=`<div class="muted" style="font-size:12.5px;margin-bottom:6px">Start from <b>${esc(plan.seed.name)}</b> ${sx(plan.seed.sex)} (already carries ${plan.line.length}/${plan.all.length} target alleles), then:</div>`;
  if(!plan.steps.length && plan.covered){ html+=`<p class="muted">${esc(plan.seed.name)} already carries every target allele — see the single-pairing options.</p>`; }
  else html+=plan.steps.map((s,i)=>{ const left=i===0?`${esc(plan.seed.name)} ${sx(plan.seed.sex)}`:"the kept pup";
    const keep=s.keepPupSex?` <b>— keep a ${sx(s.keepPupSex)} pup</b>`:"";
    return `<div style="margin:0 0 6px"><div style="font-weight:600;font-size:13px">Gen ${i+1}: ${left} × ${esc(s.partner)} ${sx(s.partnerSex)}</div>
      <div class="muted" style="font-size:12px">keep a pup that inherits ${esc(s.adds.join(", "))}${keep}</div></div>`; }).join("");
  if(!plan.covered) html+=`<p class="muted" style="font-size:11.5px;margin:6px 0 0">Couldn't chain every target through opposite-sex carriers — recruit or breed a bridging mate to reach the rest.</p>`;
  if(plan.homo.length) html+=`<p class="muted" style="font-size:11.5px;margin:6px 0 0">To <b>show</b> ${esc(plan.homo.join(", "))} (recessive needs two copies), finish by crossing two carriers and keeping a pup that inherited it from <b>both</b> parents.</p>`;
  html+=`<p class="muted" style="font-size:11.5px;margin:6px 0 0">Each cross is ♀×♂ and luck-based — a parent passes only one of its two alleles, so keep the pup that got the target (and the sex the next step needs), then breed that.</p>`;
  return html;
}

function mutationPlanHTML(pool){
  const plan=mutationPlan(pool);
  if(plan.noMut) return `<p class="muted">No mutated alleles in your breeding pool yet — set a ✦ mutation level on an allele in a nicheling's editor first.</p>`;
  if(plan.needSex) return needSexMsg;
  let html=`<div style="font-weight:700;margin-bottom:4px">Max-mutations line: gather your best ✦ into one nicheling</div>`;
  html+=`<div class="muted" style="font-size:12.5px;margin-bottom:8px">Goal ✦+${plan.ceilTotal}. Start from <b>${esc(plan.seed.name)}</b> ${sx(plan.seed.sex)} (already ✦+${plan.seed.score}), then:</div>`;
  if(!plan.steps.length){ html+=`<p class="muted">${plan.seed.score>=plan.ceilTotal?"It already carries every top mutation you own. 🎉":"No cross adds a higher mutation."}</p>`; }
  else { html+=plan.steps.map((s,i)=>{ const adds=s.adds.map(a=>`${esc(a.base)} ✦+${a.level}`).join(", "), left=i===0?`${esc(plan.seed.name)} ${sx(plan.seed.sex)}`:"the kept pup", keep=s.keepPupSex?` <b>— keep a ${sx(s.keepPupSex)} pup</b>`:"";
      return `<div style="margin:0 0 6px"><div style="font-weight:600;font-size:13px">Gen ${i+1}: ${left} × ${esc(s.partner)} ${sx(s.partnerSex)}</div><div class="muted" style="font-size:12px">gains ${adds} → line at ✦+${s.scoreAfter}${keep}</div></div>`; }).join("");
    html+=`<div style="font-weight:700;margin-top:6px">Result: a nicheling at <b>✦+${plan.finalScore}</b>.</div>`;
    if(plan.incomplete) html+=`<p class="muted" style="font-size:11.5px;margin:6px 0 0">Some ✦ couldn't be chained in — recruit or breed a bridging mate.</p>`; }
  return html;
}

      return `<span class="a">${AB_SHORT[a]} <b>~+${e.toFixed(1)}</b> <span class="muted" style="font-weight:400">(${rng})</span></span>`; }).join("")+

      const certain=pheno.length===1;
      html+=`<div style="margin:8px 0 12px"><div style="font-weight:700;font-size:13px;margin-bottom:2px">${g.label}${certain?` <span class="muted" style="font-weight:400">· always ${esc(labelText(pheno[0].label))}</span>`:""}</div>`;
      if(!certain){ pheno.forEach(p=>{ const pct=Math.round(p.prob*100); let sw="";
          if(g.mode==="incomplete"){ const pr=p.label.split(" + "); sw=blendSwatch(baseK(pr[0]),baseK(pr[1]||pr[0])); }
          else if(g.key==="eyecolor"&&EYECOL_HEX[baseK(p.label)]) sw=`<span class="swatch" style="background:${EYECOL_HEX[baseK(p.label)]}"></span>`;
          html+=`<div class="prob"><span class="nm2">${sw}${esc(labelText(p.label))}</span><span class="bar"><span style="width:${pct}%"></span></span><span class="pv">${pct}%</span></div>`; }); }

    });
    html+=`</div>`;
  });
  $("#breedOut").innerHTML=html;
}

const sx=s=>s==="F"?"♀":"♂";
/* Human-readable "what you'd lose" — pre-formatted trait labels (ability +bonus, or colour), first few. */
function describeLoss(loses){
  return esc(loses.slice(0,4).join(", "))+(loses.length>4?` <span class="muted">+${loses.length-4} more</span>`:"");
}
/* who covers a "loses nothing" nicheling — one name, or the small set that together replace its traits */
function keeperText(r){
  const n=r.keepNames||[]; if(!n.length) return " — carries no valued traits";
  const show=n.slice(0,3).map(esc), extra=n.length>3?` +${n.length-3} more`:"";
  return n.length===1 ? ` — <b>${show[0]}</b> ${sx(r.sex)} covers it`
                      : ` — <b>${show.join("</b> + <b>")}</b>${extra} together cover it`;
}
/* one ranked row, shared by Retire (archive) and Release (delete). o={actClass,actLabel,showStatus} */
function cullRow(r, o){
  const st = o.showStatus && r.status && r.status!=="active" ? ` <span class="muted" style="font-size:11px">(${r.status})</span>` : "";
  const detail = r.lossValue===0
    ? `<span class="muted">loses nothing${keeperText(r)}</span>`
    : `<span class="muted">you'd lose: ${describeLoss(r.loses)}</span>`;
  return `<div class="prob" style="margin-bottom:2px">
      <span class="nm2">${esc(r.name)} ${sx(r.sex)}${st}</span>
      <span style="flex:1;min-width:150px">${detail}</span>
      <button class="btn sm gray ${o.actClass}" data-id="${r.id}">${o.actLabel}</button></div>`;
}
/* shared safest-first ranked list body for the Retire / Release tabs. o adds the tab-specific copy. */
function cullSections(cats, abilityOnly, o){
  const ranked=retirementRanking(cats,{abilityOnly}).sort((a,b)=>a.lossValue-b.lossValue);
  const unsexed=cats.filter(c=>c.sex==="?").length, sexed=cats.filter(c=>c.sex!=="?").length;
  let html="";
  if(sexed<2){ html=`<p class="muted">Set at least two nichelings to ♀/♂ first — there's nothing to compare yet.</p>`; }
  else {
    const free=ranked.filter(r=>r.lossValue===0 && r.kept>=1), cost=ranked.filter(r=>r.lossValue>0 && r.kept>=1);   // kept>=1: never suggest the lone survivor of a sex
    if(!free.length && !cost.length){ html=`<p class="muted">${o.oneNote}</p>`; }
    else {
      html=`<p class="muted" style="font-size:12.5px;margin:0 0 10px">Ranked safest-first — each shows what it costs <b>assuming the ones above it are already gone</b>. Comparing ${abilityOnly?"ability &amp; resistance genes":"all genes"}.</p>`;
      if(free.length) html+=`<div style="font-weight:700;margin:2px 0 4px">✅ Safe — loses nothing (${free.length}):</div>`+free.map(r=>cullRow(r,o)).join("");
      if(cost.length) html+=`<div style="font-weight:700;margin:${free.length?"14px":"2px"} 0 4px">📉 Least valuable first:</div>`+cost.map(r=>cullRow(r,o)).join("");
    }
    html+=o.footNote;
  }
  if(unsexed) html+=`<p class="muted" style="font-size:11.5px;margin:6px 0 0">${unsexed} nicheling${unsexed>1?"s":""} with no sex set ${unsexed>1?"were":"was"} skipped.</p>`;
  return html;
}

/* =========================================================================
   TAB: Sync across devices
   ========================================================================= */
let __syncApi=null;
function initSync(){
  const v=document.getElementById("view-sync");
  if(!v || __syncApi || typeof SYNCKIT==="undefined") return;
  v.innerHTML='<div class="card"><h2 style="margin:0 0 6px"><span class="em">\u2601\uFE0E</span> Sync across devices</h2><div id="sk-mount"></div></div>';
  __syncApi=SYNCKIT.install({
    appId:"niche", mount:document.getElementById("sk-mount"),
    getData:()=>DB,
    setData:d=>{ if(d&&Array.isArray(d.cats)){ DB=d; DB.seq=DB.seq||(Math.max(0,...DB.cats.map(c=>c.id))+1); save(DB); showTab(); } },
    isEmpty:d=>!d||!d.cats||!d.cats.length,
    count:d=>(d&&d.cats)?d.cats.length:0,
    reveal:()=>{ TAB="sync"; showTab(); }
  });
}
function renderSync(){ initSync(); }
if(typeof document!=="undefined" && document.getElementById("tabs")){ initSync(); showTab(); }
