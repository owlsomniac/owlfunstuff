<script>
"use strict";
/* =========================================================================
   Niche: Breed & Evolve — Genetics Advisor
   Single-file, no dependencies. Gene data from the Niche Wiki B&E gene page.
   ========================================================================= */

/* ---- ability list (the only stats B&E genes grant) ---- */
const ABILITIES = ["Perception","Strength","Collecting","Fishing","Swimming","Cold Resistance","Heat Resistance","Poison Resistance"];
const AB_SHORT = {"Perception":"Per","Strength":"Str","Collecting":"Col","Fishing":"Fish","Swimming":"Swim",
  "Cold Resistance":"Cold","Heat Resistance":"Heat","Poison Resistance":"Poison"};

/* ---- colour shades + hex (for incomplete-dominance blend swatches) ---- */
const SHADE_HEX = {White:"#f0ebe0",Beige:"#d9c6a2","Moss Brown":"#8c8759",Yellow:"#e6c34d",Orange:"#d8813a",
  Red:"#b23b2e","Chestnut Brown":"#9c5b33",Brown:"#7a4a2b","Dark Brown":"#4f3320",Black:"#2b2622"};
const FUR_SHADES  = ["White","Beige","Moss Brown","Yellow","Orange","Chestnut Brown","Brown","Dark Brown","Black"];
const PAT_SHADES  = ["White","Beige","Moss Brown","Yellow","Orange","Red","Chestnut Brown","Brown","Dark Brown","Black"];
const HORN_SHADES = ["White","Beige","Red","Brown","Black"];
const EYECOL_HEX = {"Black Eyes":"#26221f","Brown Eyes":"#6b4a2b","Yellow Eyes":"#e6c34d","Green Eyes":"#4c8a3a",
  "Blue Eyes":"#3a6ea5","Leaf Green Eyes":"#5aa03a","Light Green Eyes":"#8fc46a","Teal Eyes":"#2f9c93",
  "Light Blue Eyes":"#86c1e0","Violet Eyes":"#8a5bd0","Orange Eyes":"#e07f2f","Pink Eyes":"#e58fb0","Red Eyes":"#c23b2e"};

/* Effect helper: build an allele {k,name,eff,cat}. eff maps ability->value. */
function A(name, eff, cat){ return {k:name, name, eff:eff||{}, cat:cat||"Basic"}; }
/* Colour alleles (no stats) from a shade list. */
function shadeAlleles(list){ return list.map(s=>({k:s, name:s, eff:{}, cat:"Basic", shade:s})); }

/* ---- the 18 gene categories, alleles listed MOST-DOMINANT first (for linear) ---- */
const GENES = [
  // ----- body / ability genes (linear complete dominance) -----
  {key:"ears", label:"Ears", mode:"linear", group:"body", alleles:[
    A("Medium Ears",{Perception:1}), A("Big Ears",{"Heat Resistance":2},"Hot"), A("Fluffy Ears",{"Cold Resistance":1},"Cold"),
    A("Round Ears",{Perception:1},"Cold"), A("Rabbit Ears",{Perception:3},"Grass"), A("Floppy Ears",{Perception:2},"Cold"),
    A("Pointy Ears",{Perception:2},"Grass") ]},
  {key:"horns", label:"Horns", mode:"linear", group:"body", alleles:[
    A("No Horns",{}), A("Goat Horns",{Strength:1}), A("Ram Horns",{Strength:2},"Hot"),
    A("Savanna Horns",{"Heat Resistance":1},"Hot"), A("Antlers",{"Cold Resistance":1},"Cold") ]},
  {key:"eyes", label:"Eyes", mode:"linear", group:"body", alleles:[
    A("Eyes",{Perception:2}), A("Shortsighted Eyes",{Perception:1}), A("Blind Eyes",{}) ]},
  {key:"head", label:"Head / Snout", mode:"linear", group:"body", alleles:[
    A("Derp Snout",{Perception:1}), A("Short Snout",{Perception:2}), A("Big Nose",{Perception:3},"Grass"),
    A("Cracker Jaw",{Collecting:2},"Hot"), A("Poison Fangs",{"Poison Resistance":2},"Poison"), A("Boar Tusks",{Strength:1},"Grass"),
    A("Platypus Beak",{Fishing:1},"Water"), A("Sabertooth Fangs",{Strength:2},"Cold"), A("Sticky Tongue",{Collecting:2},"Hot"),
    A("Purr Snout",{Perception:2},"Grass"), A("Digging Trunk",{Collecting:2},"Hot"), A("Bird Beak",{Collecting:2},"Grass") ]},
  {key:"body", label:"Body", mode:"linear", group:"body", alleles:[
    A("Medium Body",{Strength:1}), A("Spiky Body",{Strength:2},"Hot") ]},
  {key:"paws", label:"Paws / Hands", mode:"linear", group:"body", alleles:[
    A("Nimble Fingers",{Collecting:2}), A("Claw",{Strength:1},"Grass"), A("Digging Paw",{Collecting:3},"Grass"),
    A("Strong Paw",{Strength:1},"Cold"), A("Hoof",{Strength:2},"Grass"), A("Deformed Paw",{Collecting:1}),
    A("Fluffy Paw",{"Cold Resistance":1},"Cold"), A("Carnivore Claw",{Fishing:2},"Hot") ]},
  {key:"hindlegs", label:"Hind Legs", mode:"linear", group:"body", alleles:[
    A("Hind Legs",{Strength:1}), A("Carnivore Hind Legs",{Fishing:2},"Grass") ]},
  {key:"tail", label:"Tail", mode:"linear", group:"body", alleles:[
    A("Medium Tail",{"Cold Resistance":1}), A("No Tail",{}), A("Swimming Tail",{Swimming:1},"Water"),
    A("Fishing Tail",{Fishing:2},"Grass"), A("Warm Tail",{"Cold Resistance":2},"Cold"), A("Long Tail",{Collecting:1},"Grass"),
    A("Stinky Tail",{"Poison Resistance":1},"Poison"), A("Scorpion Tail",{"Heat Resistance":1},"Hot"), A("Hammer Tail",{Strength:2},"Cold") ]},
  // ----- colours (incomplete dominance — both alleles blend) -----
  {key:"furcolor", label:"Fur Color", mode:"incomplete", group:"color", alleles:shadeAlleles(FUR_SHADES)},
  {key:"manecolor", label:"Mane Color", mode:"incomplete", group:"color", alleles:shadeAlleles(FUR_SHADES)},
  {key:"horncolor", label:"Horn Color", mode:"incomplete", group:"color", alleles:shadeAlleles(HORN_SHADES)},
  // ----- eye colour is LINEAR in B&E (not a blend) -----
  {key:"eyecolor", label:"Eye Color", mode:"linear", group:"color", alleles:[
    A("Black Eyes"), A("Brown Eyes"), A("Yellow Eyes",{},"Grass"), A("Green Eyes",{},"Grass"), A("Blue Eyes",{},"Cold"),
    A("Leaf Green Eyes",{},"Grass"), A("Light Green Eyes",{},"Grass"), A("Teal Eyes",{},"Cold"), A("Light Blue Eyes",{},"Cold"),
    A("Violet Eyes",{},"Cold"), A("Orange Eyes",{},"Hot"), A("Pink Eyes",{},"Hot"), A("Red Eyes",{},"Hot") ]},
  // ----- pattern & mane shape (linear) -----
  {key:"manetype", label:"Mane Type", mode:"linear", group:"pattern", alleles:[
    A("Straight Mane"), A("Shaggy Mane",{},"Grass"), A("Curly Mane",{"Cold Resistance":1},"Cold") ]},
  {key:"patterntype", label:"Pattern Type", mode:"linear", group:"pattern", alleles:[
    A("No Pattern"), A("Spots"), A("Wavy Stripes",{},"Cold"), A("Dots",{},"Grass"), A("Blotches",{},"Grass"),
    A("Jagged Stripes",{},"Hot"), A("Marbled Stripes",{},"Cold"), A("Leopard Spots",{},"Hot") ]},
  {key:"patternsize", label:"Pattern Size", mode:"linear", group:"pattern", alleles:[
    A("Medium Pattern"), A("Small Pattern"), A("Large Pattern"), A("Very Small Pattern"), A("Very Big Pattern") ]},
  {key:"patterndensity", label:"Pattern Density", mode:"linear", group:"pattern", alleles:[
    A("Medium Density Pattern"), A("Sparse Pattern"), A("Dense Pattern"), A("Very Sparse Pattern"), A("Very Dense Pattern") ]},
  // pattern colour sits with the pattern genes in the genome (right before Mask) and still blends
  {key:"patterncolor", label:"Pattern Color", mode:"incomplete", group:"pattern", alleles:shadeAlleles(PAT_SHADES)},
  {key:"masksize", label:"Mask Size", mode:"linear", group:"pattern", alleles:[
    A("No Mask"), A("Medium Mask"), A("Small Mask"), A("Large Mask"), A("Very Small Mask"), A("Very Large Mask") ]}
];
const GENE_BY_KEY = {}; GENES.forEach(g=>{ GENE_BY_KEY[g.key]=g; g.domRank={}; g.alleles.forEach((a,i)=>g.domRank[a.k]=i); });
const PATTERN_SUBGENES = ["patternsize","patterndensity","patterncolor"];  // hidden when "No Pattern" is expressed
/* Fixed gene order for the compact gene code — kept stable so reordering the DISPLAY never changes
   what an existing code means. Do not reorder/remove keys; only append new genes at the end. */
const CODE_ORDER = ["ears","horns","eyes","head","body","paws","hindlegs","tail","furcolor","manecolor",
  "horncolor","patterncolor","eyecolor","manetype","patterntype","patternsize","patterndensity","masksize"];

/* =========================================================================
   ENGINE
   ========================================================================= */
/* A genotype = { geneKey: [alleleKeyA, alleleKeyB] }. Order within a slot is not meaningful. */

/* ---- mutation ----
   A mutated allele is stored as its key with a trailing "*", e.g. "Nimble Fingers*". It grants a
   stronger bonus (MUT_BONUS added to each ability it already gives) and is inherited like any allele.
   baseK strips the mark for dominance/effect lookups; isMut tests it. */
const MUT="*";   // a mutated allele is stored as "Key*N", N = mutation level (stackable, adds +N to its bonus)
const baseK=a=>{ const s=String(a==null?"":a), i=s.indexOf(MUT); return i<0?s:s.slice(0,i); };
const mutLevel=a=>{ const s=String(a==null?"":a), i=s.indexOf(MUT); if(i<0) return 0; const n=parseInt(s.slice(i+1),10); return isNaN(n)?1:Math.max(0,n); };  // "*" with no number = legacy level 1
const isMut=a=>mutLevel(a)>0;
const withMut=(k,n)=>{ n=Math.max(0,Math.floor(+n||0)); return n>0 ? baseK(k)+MUT+n : baseK(k); };

function defaultGenotype(){ const g={}; GENES.forEach(x=>{ const a=x.alleles[0].k; g[x.key]=[a,a]; }); return g; }

/* Compact shareable gene code: "NB1-" + two base36 allele-indices per gene, in GENE order.
   36 chars total (max 13 alleles → one base36 digit each). Tolerant on decode. */
function genoToCode(geno){
  let s="", mut="", any=false;
  CODE_ORDER.forEach(key=>{ const g=GENE_BY_KEY[key], p=geno[key]||[g.alleles[0].k,g.alleles[0].k];
    s += (g.domRank[baseK(p[0])]||0).toString(36) + (g.domRank[baseK(p[1])]||0).toString(36);
    const l0=Math.min(35,mutLevel(p[0])), l1=Math.min(35,mutLevel(p[1])); if(l0||l1) any=true;
    mut += l0.toString(36) + l1.toString(36); });   // per-allele mutation level, base36
  return "NB1-"+s+(any?"!"+mut:"");                  // "!" section only when something is mutated
}
function codeToGeno(code){
  const m=String(code||"").trim().match(/^NB1-([0-9a-z]+)(?:!([0-9a-z]+))?$/i); if(!m) return null;
  const s=m[1].toLowerCase(), mut=(m[2]||"").toLowerCase(), geno=defaultGenotype();
  CODE_ORDER.forEach((key,i)=>{ const g=GENE_BY_KEY[key];
    [0,1].forEach(j=>{ let al=geno[key][j]; const ch=s[2*i+j];
      if(ch!=null){ const idx=parseInt(ch,36); if(idx>=0&&idx<g.alleles.length) al=g.alleles[idx].k; }
      geno[key][j]=withMut(al, parseInt(mut[2*i+j]||"0",36)||0); });
  });
  return geno;
}
/* Sample ONE possible offspring genotype (one random allele from each parent per gene). */
function sampleOffspring(mom, dad){
  const g={}; GENES.forEach(x=>{ const mp=mom[x.key]||[x.alleles[0].k,x.alleles[0].k], dp=dad[x.key]||[x.alleles[0].k,x.alleles[0].k];
    g[x.key]=[ mp[Math.random()<0.5?0:1], dp[Math.random()<0.5?0:1] ]; });
  return g;
}

/* The expressed phenotype for one gene slot, given its two allele keys.
   Returns {kind, ...}: linear -> {kind:"single", allele}; paws -> {kind:"pair", alleles:[a,b]};
   incomplete -> {kind:"blend", alleles:[a,b]}. */
function expressGene(gene, pair){
  const [x,y] = pair;
  if(gene.mode==="incomplete"){ return {kind:"blend", alleles:[x,y].slice().sort()}; }  // colours blend
  const rx=gene.domRank[baseK(x)], ry=gene.domRank[baseK(y)];   // linear: more dominant (lower rank) shows
  if(rx!==ry) return {kind:"single", allele:(rx<ry?x:y)};       // winner keeps its mutation level
  return {kind:"single", allele:(mutLevel(x)>=mutLevel(y)?x:y)}; // same allele twice → the more-mutated copy shows
}

/* Full expressed phenotype for a genotype, plus which slots are inactivated by epistasis. */
function phenotype(geno){
  const out={};
  GENES.forEach(g=>{ out[g.key]=expressGene(g, geno[g.key]||[g.alleles[0].k,g.alleles[0].k]); });
  const noPattern = out.patterntype && out.patterntype.allele==="No Pattern";
  out._inactive = {};
  if(noPattern) PATTERN_SUBGENES.forEach(k=>out._inactive[k]=true);
  return out;
}

/* Ability totals from the EXPRESSED (dominant) allele of each gene. Colours have no stats. */
function abilityTotals(geno){
  const t={}; ABILITIES.forEach(a=>t[a]=0);
  GENES.forEach(g=>{
    const pair=geno[g.key]||[]; if(!pair.length || g.mode==="incomplete") return;
    const ex=expressGene(g,pair).allele, al=g.alleles.find(a=>a.k===baseK(ex)), boost=mutLevel(ex);
    if(al) for(const k in al.eff) t[k]+=al.eff[k]+boost;   // mutation level adds +N to the allele's bonus
  });
  return t;
}

/* Inheritance: each parent passes one of its two alleles at 50%.
   Returns a map "sortedPairKey" -> probability for the offspring's genotype at one slot. */
function offspringGenotypeDist(momPair, dadPair){
  const dist={};
  [momPair[0],momPair[1]].forEach(m=>{
    [dadPair[0],dadPair[1]].forEach(d=>{
      const key=[m,d].slice().sort().join("|");
      dist[key]=(dist[key]||0)+0.25;
    });
  });
  return dist;   // keys are "a|b"
}

/* Distribution over EXPRESSED phenotypes for one gene, from two parents. Returns
   [{label, prob, detail}] sorted desc, plus the raw genotype dist. */
function offspringPhenotypeDist(gene, momPair, dadPair){
  const gd=offspringGenotypeDist(momPair, dadPair);
  const pheno={};
  for(const key in gd){
    const pair=key.split("|");
    const ex=expressGene(gene, pair);
    let label;
    if(ex.kind==="single") label=ex.allele;
    else label=ex.alleles.join(" + ");
    pheno[label]=(pheno[label]||0)+gd[key];
  }
  const arr=Object.keys(pheno).map(l=>({label:l, prob:pheno[l]})).sort((a,b)=>b.prob-a.prob);
  return {pheno:arr, geno:gd};
}

/* Expected ability totals for offspring of two parents (P(expressed dominant allele)·eff per gene),
   with per-ability min/max across the possible offspring. Colours carry no stats. */
function offspringAbilityOutlook(mom, dad){
  const exp={}, lo={}, hi={}; ABILITIES.forEach(a=>{exp[a]=0;lo[a]=0;hi[a]=0;});
  GENES.forEach(g=>{
    if(g.mode==="incomplete") return;
    const mp=mom[g.key]||[], dp=dad[g.key]||[];
    const {pheno}=offspringPhenotypeDist(g, mp.length?mp:[g.alleles[0].k,g.alleles[0].k], dp.length?dp:[g.alleles[0].k,g.alleles[0].k]);
    ABILITIES.forEach(a=>{
      let e=0, mn=Infinity, mx=-Infinity;
      pheno.forEach(p=>{ const al=g.alleles.find(x=>x.k===baseK(p.label)); const bv=al&&al.eff[a]?al.eff[a]:0;
        const v=bv+(bv?mutLevel(p.label):0); e+=p.prob*v; mn=Math.min(mn,v); mx=Math.max(mx,v); });
      exp[a]+=e; lo[a]+=(mn===Infinity?0:mn); hi[a]+=(mx===-Infinity?0:mx);
    });
  });
  return {exp, lo, hi};
}

/* =========================================================================
   ROSTER ANALYSIS — retirement candidates
   A nicheling is "redundant" when another nicheling OF THE SAME SEX carries every
   allele it does, at an equal-or-higher mutation level: that other one can pass on
   everything this one could, so retiring it costs no breeding option. Compared per
   sex (a ♀ can only be replaced by a ♀; unsexed nichelings are skipped). "Ability"
   mode compares only genes that grant an ability/resistance, ignoring purely cosmetic
   genes (colours, eye colour, pattern shape/size/colour, mask, mane shape w/o effect).
   ========================================================================= */
const ABILITY_GENE_KEYS = GENES.filter(g=>g.alleles.some(a=>Object.keys(a.eff).length)).map(g=>g.key);

/* base allele -> highest mutation level this genotype carries, per gene */
function carryMap(geno){
  const m={};
  GENES.forEach(g=>{ const pair=geno[g.key]||[], mm={};
    pair.forEach(a=>{ const b=baseK(a), l=mutLevel(a); if(!(b in mm)||l>mm[b]) mm[b]=l; });
    m[g.key]=mm; });
  return m;
}
/* does carry B cover carry A over `keys`? (B holds every allele A holds, at >= level) */
function carryDominates(cb, ca, keys){
  return keys.every(k=>{ const A=ca[k]||{}, B=cb[k]||{};
    return Object.keys(A).every(b=> (b in B) && B[b]>=A[b]); });
}
/* Which nichelings can be retired without losing a breeding option? Returns
   [{id,name,sex,keepId,keepName}] — keep* is a nicheling that carries everything
   the retiree does. opts.abilityOnly (default false) restricts to ability genes. */
function findRetirements(cats, opts){
  opts=opts||{}; const keys = opts.abilityOnly ? ABILITY_GENE_KEYS : GENES.map(g=>g.key);
  const res=[];
  ["F","M"].forEach(sex=>{
    const grp=cats.filter(c=>c.sex===sex).map(c=>({c, carry:carryMap(c.geno)}));
    const retired=new Set();
    for(let i=0;i<grp.length;i++){ const A=grp[i];
      for(let j=0;j<grp.length;j++){ if(i===j) continue; const B=grp[j];
        if(carryDominates(B.carry,A.carry,keys)){
          const strict=!carryDominates(A.carry,B.carry,keys);
          if(strict || j<i){ retired.add(A.c.id); break; }   // strictly better, or an earlier identical copy
        }
      }
    }
    grp.forEach(A=>{ if(!retired.has(A.c.id)) return;
      const keeper = grp.find(B=>B.c.id!==A.c.id && !retired.has(B.c.id) && carryDominates(B.carry,A.carry,keys))
                  || grp.find(B=>B.c.id!==A.c.id && carryDominates(B.carry,A.carry,keys));
      res.push({id:A.c.id, name:A.c.name, sex, keepId:keeper?keeper.c.id:null, keepName:keeper?keeper.c.name:null});
    });
  });
  return res;
}

/* ---- value model for culling ----
   What a nicheling is worth KEEPING for is the bonus it can pass per ability, per gene — not which
   allele it happens to carry. So a zero-bonus allele (Blind Eyes, No Horns, No Tail) is worth nothing,
   and a lower-bonus allele (Deformed Paw Col+1) is fully covered by any higher-bonus one for the same
   ability (Nimble Col+2, Digging Col+3). Mutation level adds to the bonus. Cosmetic genes (colours /
   patterns / eye / mask / plain mane, no bonus) keep an identity notion so a unique colour still counts
   in "all genes" mode. `catAssets` → { "gene|ability" or "gene|allele" : best value }. */
const isAbilityGene = g => g.alleles.some(al=>Object.keys(al.eff).length);
function catAssets(geno, keys){
  const a={};
  keys.forEach(k=>{ const g=GENE_BY_KEY[k]; if(!g) return; const pair=geno[k]||[];
    if(isAbilityGene(g)){
      pair.forEach(x=>{ const al=g.alleles.find(z=>z.k===baseK(x)); if(!al) return; const lv=mutLevel(x);
        for(const ab in al.eff){ const v=al.eff[ab]+lv; if(v>0){ const key=k+"|"+ab; if(v>(a[key]||0)) a[key]=v; } } });
    } else {
      pair.forEach(x=>{ const key=k+"|"+baseK(x), v=1+mutLevel(x); if(v>(a[key]||0)) a[key]=v; });   // identity: a distinct colour = value 1
    }
  });
  return a;
}
const coveredBy=(A,B)=>Object.keys(A).every(k=>(B[k]||0)>=A[k]);            // B provides every trait of A at >= value
const uniqueAssetKeys=(A,others)=>Object.keys(A).filter(k=>!others.some(o=>(o[k]||0)>=A[k]));
function assetLabel(key, value){ const i=key.indexOf("|"), gk=key.slice(0,i), rest=key.slice(i+1), g=GENE_BY_KEY[gk];
  if(g && isAbilityGene(g)) return `${AB_SHORT[rest]||rest} +${value}${g?` (${g.label})`:""}`;   // rest = ability
  return `${rest}${value>1?` ✦+${value-1}`:""}${g?` (${g.label})`:""}`; }                          // rest = colour/allele

/* Ranked retirement suggestions — so this is never a flat "nothing to retire" when you need space.
   Greedy, per sex: repeatedly pick the nicheling whose removal loses the least VALUE given the others
   still kept, record it, remove it, repeat. Consume the list top-down: each entry's `loses` is what
   retiring it costs ASSUMING the ones ranked above it are already gone. `kept` = same-sex nichelings
   that would remain (so kept===0 marks the last survivor of a sex — never suggest retiring it). */
function retirementRanking(cats, opts){
  opts=opts||{}; const keys = opts.abilityOnly ? ABILITY_GENE_KEYS : GENES.map(g=>g.key);
  const res=[];
  ["F","M"].forEach(sex=>{
    let kept = cats.filter(c=>c.sex===sex).map(c=>({c, assets:catAssets(c.geno, keys)}));
    while(kept.length){
      let best=null;
      kept.forEach(A=>{ const others=kept.filter(x=>x!==A);
        const uniq=uniqueAssetKeys(A.assets, others.map(o=>o.assets));
        const val=uniq.reduce((s,k)=>s+A.assets[k],0);
        if(!best || val<best.val) best={A, uniq, val, others};
      });
      let keeper=null;
      if(best.val===0){ const dom=best.others.find(o=>coveredBy(best.A.assets,o.assets)); keeper=dom?dom.c:null; }
      res.push({id:best.A.c.id, name:best.A.c.name, sex, status:best.A.c.status,
                loses:best.uniq.map(k=>assetLabel(k, best.A.assets[k])), lossValue:best.val,
                kept:best.others.length, keepId:keeper?keeper.id:null, keepName:keeper?keeper.name:null});
      kept=kept.filter(x=>x!==best.A);
    }
  });
  return res;
}

/* =========================================================================
   MAX-MUTATIONS PLAN — gather the best mutated alleles into one line
   Model: pass-through inheritance (a pup can inherit either parent's allele AT ITS LEVEL), so a cross
   of the current line with a partner can, with luck, yield a pup carrying the per-gene MAX of both.
   The plan is a greedy order of crosses, biggest mutation gain first, that consolidates the highest
   mutated alleles you own into a single nicheling. It does NOT raise a level beyond what you have.
   ========================================================================= */
const geneMaxLevels=geno=>{ const m={}; GENES.forEach(g=>{ const p=geno[g.key]||[]; m[g.key]=p.length?Math.max(...p.map(mutLevel)):0; }); return m; };
const mutationScore=geno=>GENES.reduce((s,g)=>{ const p=geno[g.key]||[]; return s+(p.length?Math.max(...p.map(mutLevel)):0); },0);
/* the highest-level mutated allele a genotype carries for one gene (for labelling a step) */
function topMutAllele(geno, key){ const p=geno[key]||[]; if(!p.length) return null;
  const best=p.slice().sort((a,b)=>mutLevel(b)-mutLevel(a))[0]; return mutLevel(best)>0?{base:baseK(best), level:mutLevel(best)}:null; }
function mutationPlan(cats){
  const pool=cats.filter(Boolean);
  const ceil={}; GENES.forEach(g=>ceil[g.key]=0);
  pool.forEach(c=>{ const m=geneMaxLevels(c.geno); GENES.forEach(g=>{ if(m[g.key]>ceil[g.key]) ceil[g.key]=m[g.key]; }); });
  const ceilTotal=GENES.reduce((s,g)=>s+ceil[g.key],0);
  const needSex=!(pool.some(c=>c.sex==="F")&&pool.some(c=>c.sex==="M"));
  const res={ceilTotal, steps:[], seed:null, finalScore:0, needSex, noMut:ceilTotal===0};
  if(res.noMut || res.needSex) return res;
  const opp=s=>s==="F"?"M":"F";
  const seed=pool.slice().sort((a,b)=>mutationScore(b.geno)-mutationScore(a.geno)||a.id-b.id)[0];
  res.seed={name:seed.name, sex:seed.sex, score:mutationScore(seed.geno)};
  const line=geneMaxLevels(seed.geno), used=new Set([seed.id]);
  const lineScore=()=>GENES.reduce((s,g)=>s+line[g.key],0);
  let guard=0;
  while(lineScore()<ceilTotal && guard++<pool.length+2){
    const firstCross=res.steps.length===0;   // the seed itself is a parent here, so its first mate must be opposite-sex
    let best=null,bestGain=0,bestAdds=null;
    pool.forEach(c=>{ if(used.has(c.id)) return; if(firstCross && c.sex!==opp(seed.sex)) return;
      const m=geneMaxLevels(c.geno); let gain=0, adds=[];
      GENES.forEach(g=>{ if(m[g.key]>line[g.key]){ gain+=m[g.key]-line[g.key]; const t=topMutAllele(c.geno,g.key); adds.push({gene:g.key, level:m[g.key], base:t?t.base:""}); } });
      if(gain>bestGain){ bestGain=gain; best=c; bestAdds=adds; }
    });
    if(!best) break;
    used.add(best.id); bestAdds.forEach(a=>line[a.gene]=a.level);
    res.steps.push({partner:best.name, partnerSex:best.sex, gain:bestGain, adds:bestAdds, scoreAfter:lineScore()});
  }
  // each kept pup becomes the next parent, so it must be opposite-sex to the NEXT cross's partner
  res.steps.forEach((s,i)=>{ s.keepPupSex = (i+1<res.steps.length) ? opp(res.steps[i+1].partnerSex) : null; });
  res.finalScore=lineScore();
  res.incomplete = res.finalScore<ceilTotal;   // couldn't chain everything (e.g. all remaining ✦ on the seed's own sex)
  return res;
}

/* ---- colour blend swatch (interpolate two shade hexes) ---- */
function mixHex(h1,h2){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(h1), b=p(h2), m=a.map((v,i)=>Math.round((v+b[i])/2));
  return "#"+m.map(v=>v.toString(16).padStart(2,"0")).join("");
}
function shadeSwatch(sh){ return SHADE_HEX[sh]?`<span class="swatch" style="background:${SHADE_HEX[sh]}"></span>`:""; }
/* Format a phenotype label (allele key(s), possibly mutation-marked / "a + b") for display. */
function labelText(lab){ return String(lab).split(" + ").map(x=>{ const l=mutLevel(x); return baseK(x)+(l?(" ✦+"+l):""); }).join(" + "); }
function blendSwatch(a,b){
  const ha=SHADE_HEX[a], hb=SHADE_HEX[b]; if(!ha||!hb) return "";
  return `<span class="swatch" style="background:${a===b?ha:mixHex(ha,hb)}"></span>`;
}

/* ---------- ability chips ---------- */
function abilityChips(totals){
  const items=ABILITIES.filter(a=>totals[a]).map(a=>`<span class="a">${AB_SHORT[a]} <b>+${totals[a]}</b></span>`);
  return items.length?`<div class="abil">${items.join("")}</div>`:`<div class="abil"><span class="a muted">no ability bonuses</span></div>`;
}

/* ---------- expressed phenotype summary for a nicheling ---------- */
function phenoSummary(geno){
  const ph=phenotype(geno);
  const parts=GENES.map(g=>{
    if(ph._inactive[g.key]) return "";
    const ex=ph[g.key]; let txt, sw="";
    if(ex.kind==="single"){ const bk=baseK(ex.allele), lv=mutLevel(ex.allele); txt=bk+(lv?" ✦+"+lv:""); if(g.key==="eyecolor"&&EYECOL_HEX[bk]) sw=`<span class="swatch" style="background:${EYECOL_HEX[bk]}"></span>`; }
    else { const a0=baseK(ex.alleles[0]),a1=baseK(ex.alleles[1]); txt=a0===a1?a0:(a0+" + "+a1); sw=blendSwatch(a0,a1); }
    return `<span class="pill">${sw}<span class="muted">${g.label}:</span> ${esc(txt)}</span>`;
  });
  return parts.join("");
}

    </div>
    <p class="muted" style="font-size:11.5px;margin:0 0 4px">Copy to save/share this nicheling as one string; paste a code and Apply to load a whole genome. The <b>✦</b> number beside an allele is its <b>mutation level</b> — it adds that much to the allele's bonus (0 = none, stacks), and is inherited.</p>`;
  groups.forEach(([grp,title])=>{
    html+=`<h3 style="font-size:13px;color:var(--muted);margin:14px 0 6px">${title}</h3><div class="genogrid">`;
    GENES.filter(g=>g.group===grp).forEach(g=>{
      const pair=c.geno[g.key]||[g.alleles[0].k,g.alleles[0].k];
      const opts=a=>g.alleles.map(al=>`<option value="${esc(al.k)}" ${al.k===baseK(a)?"selected":""}>${esc(al.name)}</option>`).join("");
      const alrow=i=>`<div class="al"><select data-g="${g.key}" data-i="${i}">${opts(pair[i])}</select>`+
        (g.mode==="incomplete"?"":`<input type="number" class="mutn" min="0" step="1" value="${mutLevel(pair[i])}" data-mut="${g.key}" data-mi="${i}" title="Mutation level — adds +N to this allele's bonus (0 = none)">`)+`</div>`;
      html+=`<div class="slot ${groupCls(grp)}"><div class="nm">${g.label} <span style="font-weight:400">· ${g.mode==="incomplete"?"blend":"dominant/recessive"}</span></div>
        <div class="sel">${alrow(0)}${alrow(1)}</div></div>`;
    });
    html+=`</div>`;
  });
  html+=`</div>`;
  $("#editor").innerHTML=html;
  $("#closeEd").onclick=()=>{ editId=null; renderNichelings(); };
  $("#edName").oninput=e=>{ c.name=e.target.value; save(DB); };
  $("#edSex").onchange=e=>{ c.sex=e.target.value; save(DB); };
  const refreshTotals=()=>{ const ab=$("#editor .abil"); if(ab) ab.outerHTML=abilityChips(abilityTotals(c.geno));
    const ec=$("#edCode"); if(ec) ec.value=genoToCode(c.geno); };
  $$("#editor select[data-g]").forEach(s=>s.onchange=()=>{
    const g=s.dataset.g, i=+s.dataset.i; c.geno[g][i]=withMut(s.value, isMut(c.geno[g][i])); save(DB); refreshTotals();
  });
  $$("#editor input[data-mut]").forEach(inp=>inp.oninput=()=>{
    const g=inp.dataset.mut, i=+inp.dataset.mi; c.geno[g][i]=withMut(c.geno[g][i], inp.value); save(DB); refreshTotals();
  });
  $("#copyCode").onclick=()=>{ const t=$("#edCode"); t.select();
    try{ navigator.clipboard.writeText(t.value); }catch(e){ try{ document.execCommand("copy"); }catch(x){} }
    const b=$("#copyCode"), o=b.textContent; b.textContent="Copied!"; setTimeout(()=>b.textContent=o,1200); };
  $("#applyCode").onclick=()=>{ const geno=codeToGeno($("#edCode").value);
    if(!geno){ alert("That doesn't look like a valid gene code (should start with NB1-)."); return; }
    c.geno=geno; save(DB); renderEditor(); $("#editor .abil")&&($("#editor .abil").outerHTML=abilityChips(abilityTotals(c.geno))); };
}

function exportRoster(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="niche-roster.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importRoster(e){
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const r=JSON.parse(rd.result); if(r&&Array.isArray(r.cats)){ DB=r; DB.seq=DB.seq||(Math.max(0,...DB.cats.map(c=>c.id))+1); save(DB); renderNichelings(); } else alert("Not a valid roster file."); }catch(x){ alert("Could not read that file."); } };
  rd.readAsText(f); e.target.value="";
}

/* =========================================================================
   TAB: Breeding
   ========================================================================= */
function renderBreeding(){
  const v=$("#view-breeding");
  if(!DB.cats.length){ v.innerHTML=`<div class="card"><p class="muted">Add at least one nicheling under <b>My nichelings</b> first. You can breed a nicheling with itself or with any other.</p></div>`; return; }
  const retiredCount=DB.cats.filter(c=>c.status==="retired").length;
  const sidelineCount=DB.cats.filter(c=>c.status==="sideline").length;
  const tag=c=>c.status==="sideline"?" · sideline":c.status==="retired"?" · retired":"";
  // shared "Include: sideline / retired" control — shown on every breeding card, all bound to the same state
  const bar=()=>{ const parts=[];
    if(sidelineCount) parts.push(`<label class="row" style="gap:5px;font-weight:600;font-size:12px"><input type="checkbox" class="incSideline" ${breed.includeSideline?"checked":""}> sideline (${sidelineCount})</label>`);
    if(retiredCount)  parts.push(`<label class="row" style="gap:5px;font-weight:600;font-size:12px"><input type="checkbox" class="incRetired" ${breed.includeRetired?"checked":""}> retired (${retiredCount})</label>`);
    return parts.length?`<div class="row" style="gap:10px;align-items:center"><span class="muted" style="font-size:11.5px">Include:</span>${parts.join("")}</div>`:""; };

  const wireInc=()=>{ $$("#view-breeding .incSideline").forEach(cb=>cb.onchange=e=>{ breed.includeSideline=e.target.checked; renderBreeding(); });
    $$("#view-breeding .incRetired").forEach(cb=>cb.onchange=e=>{ breed.includeRetired=e.target.checked; renderBreeding(); }); };
  const pool=breedingPool();
  if(!pool.length){
    v.innerHTML=`<div class="card">${hdr('<span class="em">💞</span> Breeding')}
      <p class="muted" style="margin:10px 0 0">No nichelings to breed with. Tick a box above, or add one (tribe or sideline) under <b>My nichelings</b>.</p></div>`;
    wireInc(); return;
  }
  const opt=(sel)=>pool.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)}${c.sex!=="?"?(c.sex==="F"?" ♀":" ♂"):""}${tag(c)}</option>`).join("");
  if(!pool.some(c=>c.id===breed.mom)) breed.mom=pool[0].id;
  if(!pool.some(c=>c.id===breed.dad)) breed.dad=pool[Math.min(1,pool.length-1)].id;
  let html=`<div class="card">${hdr('<span class="em">💞</span> Predict a pairing')}
    <div class="row" style="margin-top:8px">
      <label>Parent A <select id="selMom">${opt(breed.mom)}</select></label>
      <label>Parent B <select id="selDad">${opt(breed.dad)}</select></label>
      <button class="btn sm" id="addPup">➕ Save a possible pup</button>
    </div>
    <p class="muted" style="font-size:12px;margin:8px 0 0">Each pup gets one allele per gene from each parent (50/50). Percentages below are the chance a pup <b>shows</b> that trait. <b>Save a possible pup</b> rolls one random outcome into your roster.</p>
  </div>`;
  // finders sit right under the pairing controls
  html+=`<div class="card">${hdr('🎯 Find a pairing for traits')}
    <div class="row" style="margin-top:8px">
      <label>Gene <select id="fGene">${GENES.map(g=>`<option value="${g.key}">${g.label}</option>`).join("")}</select></label>
      <label>Target <select id="fAllele"></select></label>
      <button class="btn sm gray" id="fAdd">＋ Add trait</button>
      <button class="btn sm" id="fRun">Rank my pairings</button>
    </div>
    <div id="fTargets" class="row" style="margin-top:8px;gap:6px"></div>
    <div id="finderOut" class="muted" style="margin-top:10px;font-size:13px">Add one or more target traits, then rank every ♀×♂ pair by the chance their pup shows them all at once.</div>
  </div>`;
  html+=`<div class="card">${hdr('🏆 Find optimal pairings')}
    <div class="row" style="margin-top:8px">
      <label>Maximize <select id="oMetric"><option value="__total">Total stats (all abilities)</option>${ABILITIES.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("")}</select></label>
      <button class="btn sm" id="oRun">Rank pairings</button>
    </div>
    <div id="optOut" class="muted" style="margin-top:10px;font-size:13px">Ranks every pair in your roster by the pup's <b>expected</b> stats. Pick one ability, or <b>Total</b> for the strongest overall pup.</div>
  </div>`;
  html+=`<div class="card">${hdr('💘 Find best mate for…')}
    <div class="row" style="margin-top:8px">
      <label>Nicheling <select id="bmCat">${pool.map(c=>`<option value="${c.id}" ${c.id===breed.mom?"selected":""}>${esc(c.name)}${c.sex!=="?"?(c.sex==="F"?" ♀":" ♂"):""}${tag(c)}</option>`).join("")}</select></label>
      <label>Maximize <select id="bmMetric"><option value="__total">Total stats (all abilities)</option>${ABILITIES.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("")}</select></label>
      <button class="btn sm" id="bmRun">Find best mate</button>
    </div>
    <div id="bmOut" class="muted" style="margin-top:10px;font-size:13px">Pick one of your nichelings and see which opposite-sex mate gives the strongest pup — for one ability, or overall.</div>

  html+=`<div class="card">${hdr('🧬 Max-mutations plan')}

    alert('Added "'+c.name+'" to My nichelings — one random possible outcome of this pairing.'); };
  const fillAlleles=()=>{ const g=GENE_BY_KEY[$("#fGene").value]; $("#fAllele").innerHTML=g.alleles.map(a=>`<option value="${esc(a.k)}">${esc(a.name)}</option>`).join(""); };
  $("#fGene").onchange=fillAlleles; fillAlleles();
  $("#fAdd").onclick=()=>{ finderTargets[$("#fGene").value]=$("#fAllele").value; renderFinderTargets(); };

  wireInc();
  $("#fRun").onclick=runFinder;
  $("#oRun").onclick=runOptimal;

  $("#mpRun").onclick=runMutPlan;

}

/* Rank every distinct pair in the roster by the pup's EXPECTED stats (a chosen ability, or the
   total of all abilities). Expected values already fold in dominance odds and mutation levels. */
function runOptimal(){
  const metric=$("#oMetric").value, rows=[], pool=breedingPool();
  if(!hasFM(pool)){ $("#optOut").innerHTML=needSexMsg; return; }
  for(let i=0;i<pool.length;i++) for(let j=i+1;j<pool.length;j++){
    const a=pool[i], b=pool[j]; if(!canPair(a,b)) continue;
    const o=offspringAbilityOutlook(a.geno, b.geno);
    const score = metric==="__total" ? ABILITIES.reduce((s,ab)=>s+o.exp[ab],0) : (o.exp[metric]||0);
    const top = ABILITIES.filter(ab=>o.exp[ab]>0.05).sort((x,y)=>o.exp[y]-o.exp[x]).slice(0,4).map(ab=>`${AB_SHORT[ab]} ~+${o.exp[ab].toFixed(1)}`);
    const F=a.sex==="F"?a:b, M=a.sex==="F"?b:a;
    rows.push({F:F.name, M:M.name, score, top:top.join(" · ")});
  }
  rows.sort((x,y)=>y.score-x.score);
  const top=rows.slice(0,12), label=metric==="__total"?"total stats":metric;
  let html=`<div style="font-weight:700;margin-bottom:6px">Best ♀×♂ pairings by expected ${esc(label)}:</div>`;
  if(!top.length) html+=`<p class="muted">No ♀×♂ pairs to compare — set nichelings' sex to ♀ and ♂.</p>`;
  else { const max=top[0].score||1;
    html+=top.map(r=>{ const pct=Math.round(100*r.score/max);
      return `<div class="prob" style="margin-bottom:0"><span class="nm2">${esc(r.F)} ♀ × ${esc(r.M)} ♂</span><span class="bar"><span style="width:${pct}%"></span></span><span class="pv">~${r.score.toFixed(1)}</span></div>`+
        `<div class="muted" style="font-size:11.5px;margin:0 0 7px 150px">${esc(r.top)}</div>`; }).join(""); }
  $("#optOut").innerHTML=html;
}

/* Fix one nicheling and rank every opposite-sex mate by the pup's EXPECTED stats (one ability or Total). */
function runBestMate(){
  const pool=breedingPool(), me=pool.find(c=>c.id===+$("#bmCat").value), metric=$("#bmMetric").value;
  if(!me){ $("#bmOut").innerHTML=""; return; }
  const sexEm=s=>s==="F"?"♀":"♂";
  if(me.sex==="?"){ $("#bmOut").innerHTML=`<p class="muted">Set <b>${esc(me.name)}</b>'s sex (♀/♂) first — mates are the opposite sex.</p>`; return; }
  const wantSex=me.sex==="F"?"M":"F";
  const mates=pool.filter(c=>c.id!==me.id && c.sex===wantSex);
  if(!mates.length){ $("#bmOut").innerHTML=`<p class="muted">No ${sexEm(wantSex)} nichelings to pair with <b>${esc(me.name)}</b> — set another nicheling's sex to ${sexEm(wantSex)}.</p>`; return; }
  const rows=mates.map(mate=>{
    const o=offspringAbilityOutlook(me.geno, mate.geno);
    const score = metric==="__total" ? ABILITIES.reduce((s,ab)=>s+o.exp[ab],0) : (o.exp[metric]||0);
    const top = ABILITIES.filter(ab=>o.exp[ab]>0.05).sort((x,y)=>o.exp[y]-o.exp[x]).slice(0,4).map(ab=>`${AB_SHORT[ab]} ~+${o.exp[ab].toFixed(1)}`);
    return {mate, score, top:top.join(" · ")};
  }).sort((a,b)=>b.score-a.score);
  const label=metric==="__total"?"total stats":metric, top=rows.slice(0,12), max=top[0].score||1;
  let html=`<div style="font-weight:700;margin-bottom:6px">Best mates for <b>${esc(me.name)}</b> ${sexEm(me.sex)} by expected ${esc(label)}:</div>`;
  html+=top.map(r=>{ const pct=Math.round(100*r.score/max);
    const pair = me.sex==="F" ? `${esc(me.name)} ♀ × ${esc(r.mate.name)} ♂` : `${esc(r.mate.name)} ♀ × ${esc(me.name)} ♂`;
    return `<div class="prob" style="margin-bottom:0"><span class="nm2">${pair}</span><span class="bar"><span style="width:${pct}%"></span></span><span class="pv">~${r.score.toFixed(1)}</span></div>`+
      `<div class="muted" style="font-size:11.5px;margin:0 0 7px 150px">${esc(r.top)}</div>`; }).join("");
  $("#bmOut").innerHTML=html;
}

/* Greedy ordered crosses to consolidate the roster's best mutated (✦) alleles into one nicheling. */
function runMutPlan(){
  const plan=mutationPlan(breedingPool());
  let html="";
  if(plan.noMut){ html=`<p class="muted">No mutated alleles in your breeding pool yet — set a ✦ mutation level on an allele in a nicheling's editor first.</p>`; }
  else if(plan.needSex){ html=needSexMsg; }
  else {
    html=`<div style="font-weight:700;margin-bottom:4px">Goal: one nicheling carrying <b>✦+${plan.ceilTotal}</b> total mutation — the best of every gene you own.</div>`;
    html+=`<div class="muted" style="font-size:12.5px;margin-bottom:8px">Start from <b>${esc(plan.seed.name)}</b> ${sx(plan.seed.sex)} (already ✦+${plan.seed.score}), then:</div>`;
    if(!plan.steps.length){
      html+=`<p class="muted">${plan.seed.score>=plan.ceilTotal?"It already carries every top mutation you own — nothing left to gather. 🎉":"No cross adds a higher mutation."}</p>`;
    } else {
      html+=plan.steps.map((s,i)=>{
        const adds=s.adds.map(a=>`${esc(a.base)} ✦+${a.level}`).join(", ");
        const left = i===0 ? `${esc(plan.seed.name)} ${sx(plan.seed.sex)}` : "the kept pup";
        const keep = s.keepPupSex ? ` <b>— keep a ${sx(s.keepPupSex)} pup</b>` : "";
        return `<div style="margin:0 0 6px"><div style="font-weight:600;font-size:13px">Gen ${i+1}: ${left} × ${esc(s.partner)} ${sx(s.partnerSex)}</div>
          <div class="muted" style="font-size:12px">gains ${adds} → line at ✦+${s.scoreAfter}${keep}</div></div>`;
      }).join("");
      html+=`<div style="font-weight:700;margin-top:6px">Result: a nicheling at <b>✦+${plan.finalScore}</b>.</div>`;
      if(plan.incomplete) html+=`<p class="muted" style="font-size:11.5px;margin:6px 0 0">Some ✦ couldn't be chained in (they sit on nichelings the same sex as your seed with no opposite-sex carrier to bridge through) — recruit or breed a bridging mate to reach them.</p>`;
    }
    html+=`<p class="muted" style="font-size:11.5px;margin:8px 0 0">Each cross is ♀×♂, and a parent passes only <b>one</b> of its two alleles (so a nicheling holding the same allele at ✦+3 and ✦+1 passes just one of them). After a cross, keep a pup that inherited the ✦ allele — it may take a few tries, and you'll want one of the sex the next step needs — then breed that. Mutations stick to their allele and don't stack, so this <b>gathers</b> your best existing ✦ into one line.</p>`;
  }
  $("#mpOut").innerHTML=html;
}

function renderBreedOut(){
  const mom=DB.cats.find(c=>c.id===breed.mom), dad=DB.cats.find(c=>c.id===breed.dad);
  if(!mom||!dad){ $("#breedOut").innerHTML=""; return; }
  const outlook=offspringAbilityOutlook(mom.geno, dad.geno);
  // ability outlook
  let html=`<div class="card"><h2>Ability outlook for the pup</h2><div class="abil">`+
    ABILITIES.filter(a=>outlook.hi[a]).map(a=>{
      const e=outlook.exp[a], lo=outlook.lo[a], hi=outlook.hi[a];
      const rng=lo===hi?`+${lo}`:`+${lo}–${hi}`;
      return `<span class="a">${AB_SHORT[a]} <b>~+${e.toFixed(1)}</b> <span class="muted" style="font-weight:400">(${rng})</span></span>`;
    }).join("")+`</div><p class="muted" style="font-size:12px;margin:8px 0 0">~average expected, with the possible range. Paws count both hands.</p></div>`;
  // per-gene phenotype probabilities, grouped
  const groups=[["body","Body & abilities"],["color","Colours"],["pattern","Pattern & mane"]];
  groups.forEach(([grp,title])=>{
    html+=`<div class="card"><h2>${title}</h2>`;
    GENES.filter(g=>g.group===grp).forEach(g=>{
      const {pheno}=offspringPhenotypeDist(g, mom.geno[g.key], dad.geno[g.key]);
      const certain=pheno.length===1;
      html+=`<div style="margin:8px 0 12px"><div style="font-weight:700;font-size:13px;margin-bottom:2px">${g.label}${certain?` <span class="muted" style="font-weight:400">· always ${esc(labelText(pheno[0].label))}</span>`:""}</div>`;
      if(!certain){
        pheno.forEach(p=>{
          const pct=Math.round(p.prob*100);
          let sw="";
          if(g.mode==="incomplete"){ const pr=p.label.split(" + "); sw=blendSwatch(baseK(pr[0]),baseK(pr[1]||pr[0])); }
          else if(g.key==="eyecolor"&&EYECOL_HEX[baseK(p.label)]) sw=`<span class="swatch" style="background:${EYECOL_HEX[baseK(p.label)]}"></span>`;
          html+=`<div class="prob"><span class="nm2">${sw}${esc(labelText(p.label))}</span><span class="bar"><span style="width:${pct}%"></span></span><span class="pv">${pct}%</span></div>`;
        });
      }
      html+=`</div>`;
    });
    html+=`</div>`;
  });
  $("#breedOut").innerHTML=html;
}

/* Breeding needs one ♀ and one ♂, so pairings only consider opposite-sex nichelings. */
const canPair=(a,b)=>(a.sex==="F"&&b.sex==="M")||(a.sex==="M"&&b.sex==="F");
const hasFM=list=>list.some(c=>c.sex==="F")&&list.some(c=>c.sex==="M");
const needSexMsg='<p class="muted">Pairings need one ♀ and one ♂ — set each nicheling\'s sex in its editor (the ♀/♂ dropdown).</p>';

/* render the chosen target-trait chips (one per gene; removable). Survives breeding re-renders. */
function renderFinderTargets(){
  const el=$("#fTargets"); if(!el) return;
  const keys=Object.keys(finderTargets);
  el.innerHTML = keys.length
    ? keys.map(k=>{ const g=GENE_BY_KEY[k], al=g.alleles.find(a=>a.k===finderTargets[k]);
        return `<span class="pill"><b>${esc(g.label)}:</b> ${esc(al?al.name:finderTargets[k])} <a href="#" data-rm="${k}" style="text-decoration:none;color:var(--warn)">✕</a></span>`; }).join("")
      +`<button class="btn sm gray" id="fClear" style="margin-left:4px">Clear all</button>`
    : `<span class="muted" style="font-size:12px">No target traits yet — pick a gene &amp; allele and hit <b>＋ Add trait</b>. Add several (across genes) to find a pair that hits them all.</span>`;
  $$("#fTargets [data-rm]").forEach(a=>a.onclick=e=>{ e.preventDefault(); delete finderTargets[a.dataset.rm]; renderFinderTargets(); });
  if($("#fClear")) $("#fClear").onclick=()=>{ finderTargets={}; renderFinderTargets(); };
}
/* rank every ♀×♂ pair by the JOINT chance the pup shows ALL selected target traits (genes are independent). */
function runFinder(){
  const pool=breedingPool(), gkeys=Object.keys(finderTargets);
  if(!gkeys.length){ $("#finderOut").innerHTML=`<p class="muted">Add at least one target trait with <b>＋ Add trait</b>.</p>`; return; }
  if(!hasFM(pool)){ $("#finderOut").innerHTML=needSexMsg; return; }
  const rows=[];
  for(let i=0;i<pool.length;i++) for(let j=i+1;j<pool.length;j++){
    const a=pool[i], b=pool[j]; if(!canPair(a,b)) continue;
    let joint=1;
    gkeys.forEach(gk=>{ const g=GENE_BY_KEY[gk], res=offspringPhenotypeDist(g, a.geno[gk], b.geno[gk]);
      let p=0; res.pheno.forEach(ph=>{ if(ph.label.split(" + ").map(baseK).includes(finderTargets[gk])) p+=ph.prob; });
      joint*=p; });
    if(joint>0){ const F=a.sex==="F"?a:b, M=a.sex==="F"?b:a; rows.push({F:F.name, M:M.name, joint}); }
  }
  rows.sort((x,y)=>y.joint-x.joint);
  const top=rows.slice(0,12);
  const names=gkeys.map(gk=>{ const g=GENE_BY_KEY[gk], al=g.alleles.find(a=>a.k===finderTargets[gk]); return al?al.name:finderTargets[gk]; }).join(" + ");
  let html=`<div style="font-weight:700;margin-bottom:6px">Chance the pup shows <b>${esc(names)}</b>${gkeys.length>1?` (all ${gkeys.length})`:""}:</div>`;
  if(!top.length) html+=`<p class="muted">No ♀×♂ pairing in your roster can produce ${gkeys.length>1?"all of those together":"it"} — at least one target isn't carried by any opposite-sex pair.</p>`;
  else html+=top.map(r=>{
    const pct=r.joint*100, pv=pct>=0.5?Math.round(pct)+"%":"<1%", w=Math.max(2,Math.round(pct));
    return `<div class="prob"><span class="nm2">${esc(r.F)} ♀ × ${esc(r.M)} ♂</span><span class="bar"><span style="width:${w}%"></span></span><span class="pv">${pv}</span></div>`;
  }).join("");
  $("#finderOut").innerHTML=html;
}

/* =========================================================================
   TAB: Retire
   ========================================================================= */
function renderRetire(){
  const v=$("#view-retire");
  v.innerHTML=`<div class="card"><h2><span class="em">🧹</span> Who to retire</h2>
    <p class="muted" style="font-size:12.5px;margin:2px 0 0">Out of space? This ranks your nichelings from safest-to-retire to most valuable, comparing each against others of the <b>same sex</b>. The top ones lose nothing (another nicheling already gives every trait they do at an equal-or-better bonus — undesirable/low-bonus alleles don't count); further down, it shows exactly what each retirement would cost.</p>
    <div class="row" style="margin-top:10px">
      <label>Compare on <select id="rMode"><option value="ability">Ability &amp; resistance genes</option><option value="all">All genes (incl. colours)</option></select></label>
      <button class="btn sm" id="rRun">Rank who to retire</button>
    </div>
    <div id="retireOut" style="margin-top:12px;font-size:13px"></div>
  </div>`;
  $("#rMode").onchange=runRetire;
  $("#rRun").onclick=runRetire;
  runRetire();   // show suggestions right away
}

const sx=s=>s==="F"?"♀":"♂";
/* Human-readable "what you'd lose" — pre-formatted trait labels (ability +bonus, or colour), first few. */
function describeLoss(loses){
  return esc(loses.slice(0,4).join(", "))+(loses.length>4?` <span class="muted">+${loses.length-4} more</span>`:"");
}
/* one ranked row, shared by Retire (archive) and Release (delete). o={actClass,actLabel,showStatus} */
function cullRow(r, o){
  const st = o.showStatus && r.status && r.status!=="active" ? ` <span class="muted" style="font-size:11px">(${r.status})</span>` : "";
  const detail = r.lossValue===0
    ? `<span class="muted">loses nothing${r.keepName?` — <b>${esc(r.keepName)}</b> ${sx(r.sex)} covers it`:""}</span>`
    : `<span class="muted">you'd lose: ${describeLoss(r.loses)}</span>`;
  return `<div class="prob" style="margin-bottom:2px">
      <span class="nm2">${esc(r.name)} ${sx(r.sex)}${st}</span>
      <span style="flex:1;min-width:150px">${detail}</span>
      <button class="btn sm gray ${o.actClass}" data-id="${r.id}">${o.actLabel}</button></div>`;
}
/* shared safest-first ranked list body for the Retire / Release tabs. o adds the tab-specific copy. */
function cullSections(cats, abilityOnly, o){
  const ranked=retirementRanking(cats,{abilityOnly}).sort((a,b)=>a.lossValue-b.lossValue);
  const unsexed=cats.filter(c=>c.sex==="?").length, sexed=cats.filter(c=>c.sex!=="?").length;
  let html="";
  if(sexed<2){ html=`<p class="muted">Set at least two nichelings to ♀/♂ first — there's nothing to compare yet.</p>`; }
  else {
    const free=ranked.filter(r=>r.lossValue===0), cost=ranked.filter(r=>r.lossValue>0 && r.kept>=1);
    if(!free.length && !cost.length){ html=`<p class="muted">${o.oneNote}</p>`; }
    else {
      html=`<p class="muted" style="font-size:12.5px;margin:0 0 10px">Ranked safest-first — each shows what it costs <b>assuming the ones above it are already gone</b>. Comparing ${abilityOnly?"ability &amp; resistance genes":"all genes"}.</p>`;
      if(free.length) html+=`<div style="font-weight:700;margin:2px 0 4px">✅ Safe — loses nothing (${free.length}):</div>`+free.map(r=>cullRow(r,o)).join("");
      if(cost.length) html+=`<div style="font-weight:700;margin:${free.length?"14px":"2px"} 0 4px">📉 Least valuable first:</div>`+cost.map(r=>cullRow(r,o)).join("");
    }
    html+=o.footNote;
  }
  if(unsexed) html+=`<p class="muted" style="font-size:11.5px;margin:6px 0 0">${unsexed} nicheling${unsexed>1?"s":""} with no sex set ${unsexed>1?"were":"was"} skipped.</p>`;
  return html;
}
/* Rank ACTIVE nichelings you can retire (archive), safest first. */
function runRetire(){
  const abilityOnly=$("#rMode").value==="ability";
  $("#retireOut").innerHTML=cullSections(activeCats(), abilityOnly, {actClass:"rtire", actLabel:"Retire", showStatus:false,
    oneNote:"Only one nicheling per sex — you can't retire either without losing your breeding stock.",
    footNote:`<p class="muted" style="font-size:11.5px;margin:10px 0 0">"Loses nothing" = another same-sex nicheling already gives <b>every trait it does at an equal-or-better bonus</b> — zero-bonus alleles (No Horns, Blind Eyes, No Tail) and lower-bonus ones don't count. <b>Retire</b> archives it to your <b>Retired</b> list (bring it back anytime); the list re-ranks after each one.</p>`});
  $$("#retireOut .rtire").forEach(b=>b.onclick=()=>{ const id=+b.dataset.id, c=DB.cats.find(x=>x.id===id);
    if(c && confirm('Retire "'+c.name+'"? It moves to your Retired list — bring it back anytime from My nichelings.')){
      c.status="retired"; if(editId===id) editId=null; save(DB); runRetire(); } });
}

/* =========================================================================
   TAB: Release  (permanent delete, ranked safest-first like Retire)
   ========================================================================= */
function renderRelease(){
  const v=$("#view-release");
  v.innerHTML=`<div class="card"><h2><span class="em">🕊️</span> Who to release</h2>
    <p class="muted" style="font-size:12.5px;margin:2px 0 0">Ranks every nicheling in your <b>whole roster</b> (tribe, sidelines &amp; retired) by how safely it can be <b>released — permanently deleted</b>. The top ones lose nothing (another same-sex nicheling already gives every trait they do at an equal-or-better bonus — undesirable/low-bonus alleles don't count); each shows its group.</p>
    <div class="row" style="margin-top:10px">
      <label>Compare on <select id="rlMode"><option value="ability">Ability &amp; resistance genes</option><option value="all">All genes (incl. colours)</option></select></label>
      <button class="btn sm" id="rlRun">Rank who to release</button>
    </div>
    <div id="releaseOut" style="margin-top:12px;font-size:13px"></div>
  </div>`;
  $("#rlMode").onchange=runRelease;
  $("#rlRun").onclick=runRelease;
  runRelease();
}
/* Rank the WHOLE roster by how safely each can be permanently deleted. */
function runRelease(){
  const abilityOnly=$("#rlMode").value==="ability";
  $("#releaseOut").innerHTML=cullSections(DB.cats, abilityOnly, {actClass:"rlease", actLabel:"Release", showStatus:true,
    oneNote:"Only one nicheling per sex — releasing it would lose that gene line entirely.",
    footNote:`<p class="muted" style="font-size:11.5px;margin:10px 0 0">"Loses nothing" = another same-sex nicheling already gives <b>every trait it does at an equal-or-better bonus</b> — zero-bonus alleles (No Horns, Blind Eyes, No Tail) and lower-bonus ones don't count. <b>Release permanently deletes</b> the nicheling — it does <b>not</b> go to Retired. The list re-ranks after each one.</p>`});
  $$("#releaseOut .rlease").forEach(b=>b.onclick=()=>{ const id=+b.dataset.id, c=DB.cats.find(x=>x.id===id);
    if(c && confirm('Release (permanently delete) "'+c.name+'"? This cannot be undone — use Retire if you might want it back.')){
      DB.cats=DB.cats.filter(x=>x.id!==id); if(editId===id) editId=null; save(DB); runRelease(); } });
}

/* =========================================================================
   TAB: Gene reference
   ========================================================================= */
function renderGenes(){
  const v=$("#view-genes");
  let html=`<div class="note">B&amp;E has <b>18 gene categories</b>. Most are <b>dominant/recessive</b> — the top (dominant) allele shows and gives its ability; the recessive one is carried but hidden (the wiki lists them most-dominant first). <b>Fur, Mane, Horn &amp; Pattern colours</b> use <b>incomplete dominance</b> — the two alleles blend. When <b>No Pattern</b> shows, the pattern size/density/colour genes are hidden (but still inherited).</div>`;
  const groups=[["body","Body & ability genes"],["color","Colour genes"],["pattern","Pattern & mane genes"]];
  groups.forEach(([grp,title])=>{
    html+=`<div class="card"><h2>${title}</h2>`;
    GENES.filter(g=>g.group===grp).forEach(g=>{
      const modeTxt=g.mode==="incomplete"?"incomplete (blend)":"dominant → recessive";
      html+=`<details class="gene"><summary>${g.label}<span class="mode">${modeTxt}</span></summary><div class="body scrollx"><table>
        <tr><th>${g.mode==="linear"?"Dom.":""}</th><th>Gene</th><th>Effect</th></tr>`;
      g.alleles.forEach((a,i)=>{
        const eff=Object.keys(a.eff).length?Object.keys(a.eff).map(k=>`${k} +${a.eff[k]}`).join(", "):(g.mode==="incomplete"?"colour only":"—");
        let sw=""; if(g.group==="color"&&g.mode==="incomplete") sw=shadeSwatch(a.k); if(g.key==="eyecolor"&&EYECOL_HEX[a.k]) sw=`<span class="swatch" style="background:${EYECOL_HEX[a.k]}"></span>`;
        html+=`<tr><td>${g.mode==="linear"?(i+1):""}</td><td>${sw}${esc(a.name)}</td><td>${esc(eff)}</td></tr>`;
      });
      html+=`</table></div></details>`;
    });
    html+=`</div>`;
  });
  v.innerHTML=html;
}
