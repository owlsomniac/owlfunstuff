<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>owlfunstuff</title>
<meta name="description" content="Small self-contained web tools.">
<style>
  :root{
    --bg:#f4efe6; --bg2:#ece3d3; --panel:#fffdf8; --ink:#3a3229; --muted:#8c7f6c;
    --line:#e4d9c5; --brand:#c8622d; --brand-ink:#a1471c; --brand-soft:#f3d9c6;
    --shadow:0 1px 2px rgba(60,45,25,.06),0 10px 28px rgba(60,45,25,.09);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#201c17; --bg2:#17130f; --panel:#2b251d; --ink:#efe6d6; --muted:#988c78;
      --line:#43392c; --brand:#e0824c; --brand-ink:#efa579; --brand-soft:#4a3122;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35); }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink);line-height:1.5;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1000px 500px at 20% -10%,var(--bg2),transparent 60%),var(--bg);}
  .wrap{width:100%;max-width:560px}
  h1{font-size:28px;letter-spacing:-.5px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
  .tag{color:var(--muted);font-size:14px;margin:0 0 22px}
  a.tool{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
  a.tool:hover{border-color:var(--brand)}
  a.tool .em{font-size:34px;flex:0 0 auto}
  a.tool .grow{flex:1 1 auto;min-width:0}
  a.tool h2{margin:0;font-size:18px;color:var(--brand-ink)}
  a.tool p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
  a.tool .arrow{color:var(--brand);font-size:22px;flex:0 0 auto}
  footer{margin-top:22px;color:var(--muted);font-size:12px;text-align:center}
  footer a{color:var(--muted)}
</style>
</head>
<body>
  <div class="wrap">
    <h1><span aria-hidden="true">🦉</span> owlfunstuff</h1>
    <p class="tag">Small self-contained web tools.</p>

    <a class="tool" href="./pixelcatsend-advisor/">
      <span class="em" aria-hidden="true">🐾</span>
      <span class="grow">
        <h2>Pixel Cat's End — Adventuring Advisor</h2>
        <p>Pull a cat's stats by ID, read the bonuses each gives, and get class &amp; day-job picks.</p>
      </span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <footer>Hosted on GitHub Pages · <a href="https://github.com/owlsomniac/owlfunstuff" target="_blank" rel="noopener">source</a></footer>
  </div>
</body>
</html>
